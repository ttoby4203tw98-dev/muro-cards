<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日出貨流程</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4a2c3a">
<style>
  :root{
    --plum:#4a2c3a; --plum2:#6b3f52; --rose:#9c5c6e; --gold:#d6a680;
    --cream:#faf6f2; --ink:#372a30; --ink2:#8a7580; --line:#eee2da;
    --ok:#148F62; --okbg:#E6F4EC; --skip:#b9a8b0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}
  .top{background:linear-gradient(160deg,var(--plum),var(--plum2) 60%,var(--rose));color:#f6eee8;
    padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 24px;border-radius:0 0 24px 24px;text-align:center;}
  .top h1{font-size:22px;font-weight:800;letter-spacing:3px;}
  .top h1 small{font-size:11px;letter-spacing:3px;opacity:.7;margin-left:8px;}
  #dateline{font-size:13px;opacity:.8;margin-top:6px;}
  .legend{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;letter-spacing:1px;background:rgba(255,255,255,.14);border-radius:99px;padding:4px 14px;}
  .when{font-size:12.5px;opacity:.85;margin-top:8px;}
  .prog{max-width:420px;margin:14px auto 0;}
  .prog .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;}
  .prog .fill{height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .3s;}
  .prog .txt{font-size:14px;font-weight:800;margin-top:8px;letter-spacing:1px;}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(74,44,58,.07);margin-top:14px;}
  .flabel{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:1px;margin-bottom:10px;}
  .optrow{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{border:none;border-radius:99px;padding:8px 16px;font-size:14px;font-weight:800;cursor:pointer;color:#fff;opacity:.45;}
  .opt.on{opacity:1;box-shadow:0 3px 10px rgba(74,44,58,.25);transform:scale(1.05);}
  .s-p0{background:#C2185B;}.s-p1{background:#1E56C9;}.s-p2{background:#7B3FBF;}.s-p3{background:#37474F;}
  .s-p4{background:#148F62;}.s-p5{background:#D6308A;}.s-p6{background:#C77800;}.s-p7{background:#E05716;}
  .s-p8{background:#33698C;}.s-p9{background:#A08A00;}.s-p10{background:#0E7C9E;}.s-p11{background:#7A6F52;}

  .sec{margin-top:18px;}
  .sec h2{font-size:15px;color:var(--plum2);letter-spacing:1px;display:flex;align-items:center;gap:8px;padding:0 4px;}
  .sec h2 .n{background:var(--plum2);color:#fff;font-size:12px;border-radius:8px;padding:2px 8px;}
  .sec h2 .cnt{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:600;}
  .steps{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 18px rgba(74,44,58,.07);margin-top:10px;overflow:hidden;}
  .step{display:flex;gap:12px;padding:14px 14px;border-top:1px dashed var(--line);cursor:pointer;transition:background .15s;}
  .step:first-child{border-top:none;}
  .step:active{background:#fbf5f8;}
  .step.done{background:#f5faf7;}
  .step.skip{opacity:.5;cursor:default;}
  .ring{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid #d9c9d1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--ink2);margin-top:1px;}
  .done .ring{background:var(--ok);border-color:var(--ok);color:#fff;}
  .skip .ring{background:#eee;border-color:#eee;color:var(--skip);}
  .body{flex:1;min-width:0;}
  .ttl{font-size:15.5px;font-weight:800;line-height:1.4;}
  .done .ttl{color:#146C48;}
  .hint{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:3px;}
  .hint b{color:var(--plum2);font-weight:700;}
  .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .tool{font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;text-decoration:none;}
  .tool.link{background:#e9eff8;color:#1E56C9;}
  .tool.bat{background:#fdf0e0;color:#b0813f;}
  .stamp{font-size:12px;color:#146C48;font-weight:700;margin-top:6px;}
  .skip .stamp{color:var(--skip);}
  .pills{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .pill{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;font-weight:800;color:var(--ink2);cursor:pointer;}
  .pill.on{background:var(--plum2);border-color:var(--plum2);color:#fff;}
  .pill.on.warn{background:#C77800;border-color:#C77800;}

  textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;font-family:inherit;min-height:70px;resize:vertical;}
  textarea:focus{outline:none;border-color:var(--plum2);}
  .btnrow{display:flex;gap:10px;margin-top:12px;}
  .btn{flex:1;border:none;border-radius:14px;font-size:15px;font-weight:800;padding:13px 0;cursor:pointer;color:#fff;letter-spacing:1px;}
  .btn.done-all{background:var(--ok);}
  .btn.reset{background:#fff;color:var(--rose);border:1.5px solid var(--line);}
  #msg{margin-top:12px;font-size:14px;font-weight:700;text-align:center;border-radius:12px;padding:10px;display:none;}
  #msg.good{display:block;background:#E6F4EC;color:#146C48;}
  #msg.warn{display:block;background:#FCF3D7;color:#8a6a10;}
  #msg.bad{display:block;background:#FBE4E4;color:#A4344F;}
  .today h2{font-size:15px;color:var(--plum2);letter-spacing:1px;margin-bottom:10px;}
  .trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:14px;}
  .trow:first-child{border-top:none;}
  .tdate{font-weight:800;min-width:52px;}
  .twho{min-width:44px;font-weight:700;}
  .tst{font-size:12.5px;border-radius:6px;padding:2px 9px;font-weight:700;}
  .tst.fin{background:#E6F4EC;color:#146C48;}
  .tst.run{background:#FCF3D7;color:#8a6a10;}
  .tnote{margin-left:auto;font-size:12px;color:var(--ink2);max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .empty{color:var(--ink2);font-size:14px;}
  .daterow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .daterow input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;}
  .daterow input:focus{outline:none;border-color:var(--plum2);}
  .daterow button{border:none;border-radius:12px;background:var(--plum2);color:#fff;font-weight:800;font-size:14px;padding:10px 14px;cursor:pointer;}
  .vsum{font-size:13.5px;color:var(--ink2);margin-bottom:8px;line-height:1.7;}
  .vsum b{color:var(--plum2);}
  .vsec{font-size:13px;font-weight:800;color:var(--plum2);margin:10px 0 4px;letter-spacing:1px;}
  .vrow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);font-size:14px;line-height:1.5;}
  .vrow .vi{flex:0 0 22px;height:22px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;background:#eee;color:var(--skip);margin-top:1px;}
  .vrow.ok .vi{background:var(--ok);color:#fff;}
  .vrow .vt{flex:1;}
  .vrow .vs{font-size:12px;color:#146C48;font-weight:700;white-space:nowrap;}
  .vrow.no .vs{color:#c9b3bd;}
  .vnote{margin-top:10px;background:#fbf5f8;border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
  .trow{cursor:pointer;}
  footer{text-align:center;margin-top:22px;font-size:12px;color:#b9a8b0;}
  footer a{color:var(--rose);}
</style>
</head>
<body>

<div class="top">
  <h1>每日出貨流程<small>MURO</small></h1>
  <div id="dateline"></div>
  <div class="legend">大邁寶＝深圳倉　｜　BigSeller＝台灣倉</div>
  <div class="when">⏰ 每天早上第一場直播結束後開始，連第一場的單一起處理</div>
  <div class="prog">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="txt" id="progTxt">今天完成 0 / 17</div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="flabel">我是誰（打勾會記上名字）</div>
    <div class="optrow" id="whoRow"></div>
  </div>

  <div id="secs"></div>

  <div class="card">
    <div class="flabel">今日備註（缺貨、異常、要交代的事）</div>
    <textarea id="note" placeholder="例：#3021 黑色 M 未到，包裹已寫 9/6"></textarea>
    <div class="btnrow">
      <button class="btn done-all" id="saveBtn">儲存備註</button>
      <button class="btn reset" id="resetBtn">清空今天重來</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card today">
    <h2>📅 查某一天的紀錄</h2>
    <div class="daterow"><input type="date" id="pickDate"><button id="pickToday">今天</button></div>
    <div id="dayView" class="empty">選日期，或點下面列表的某一天</div>
  </div>

  <div class="card today">
    <h2>🗂 出貨紀錄（近 14 天）</h2>
    <div id="recList" class="empty">載入中…</div>
  </div>

  <footer><a href="team.html">← 回團隊首頁</a></footer>
</div>

<script>
var SHEET_ID='1SsIRULQjX5dQJgnEzfijQuZV5lfJKHmwHy2CJvG_XwE';
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbxujluuIzHbqtxJJtssliT1bOiU8Q8J0NWhAbYJzGTueqUWaEKFhzraBMapcGLBq95QMg/exec';
var TOKEN='muro2026';
var SHIP_CSV='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent('物流');

var DMB='https://www.damaibb.com';
var SECTIONS=[
 {name:'同步與對單（台灣倉先剔除）',steps:[
  {id:'s1',t:'大邁寶 同步蝦皮訂單',h:'按<b>店鋪</b>同步，日期選<b>前天 → 現在</b>，同步後訂單<b>備註</b>才會更新',tools:[{l:'大邁寶 訂單處理',u:DMB+'/trade/flow/todo',k:'link'}]},
  {id:'s2',t:'查 BigSeller：台灣倉這批有要出的單嗎？',q:'q2',opts:[{v:'有',l:'有'},{v:'沒有',l:'沒有'}],h:'BigSeller 上的單 = 台灣倉出貨。選「沒有」會略過下一步，直接進深圳倉驗貨',tools:[{l:'BigSeller',u:'https://www.bigseller.com/',k:'link'}]},
  {id:'s3',t:'對單隔離：把台灣出貨單從大邁寶移除',h:'開工具包跑 <b>bigseller 對單隔離</b>，台灣要出的單在大邁寶隔離掉，<b>避免深圳倉重複出貨</b>；隔離完跟台灣倉確認這些單能正常出',tools:[{l:'每日1_大邁寶對單隔離.bat',k:'bat'},{l:'大邁寶 訂單處理',u:DMB+'/trade/flow/todo',k:'link'}],skipIf:function(st){return st.ans.q2==='沒有';}}
 ]},
 {name:'現貨先出',steps:[
  {id:'s6',t:'有現貨可出的單：列印 → 出貨',h:'含早上第一場直播的單。今天能出的全部先出掉，再進採購'}
 ]},
 {name:'採購',steps:[
  {id:'s7',t:'剩餘訂單逐一檢查貨源',h:'剩下的單 = 要採購的單。<b>深圳倉有現貨的品要把貨源移除</b>，才不會被批量採購叫到',tools:[{l:'大邁寶 商品匹配',u:DMB+'/warehouse/mapping',k:'link'}]},
  {id:'s8',t:'無貨源又沒現貨 → 新增貨源 → 匹配 SKU',h:'大邁寶先<b>添加貨源</b>（貼 1688 連結），再開工具包跑 SKU 匹配；對不上的人工補',tools:[{l:'工具_大邁寶SKU匹配.bat',k:'bat'}]},
  {id:'s9',t:'全部有貨源、SKU 都對好 → 批量採購',h:'少一個貨源都先補完再按批量採購。<b>按完後看左上角「訂單合併狀態」，一定要調成「合併」</b>',tools:[{l:'大邁寶 採購清單',u:DMB+'/trade/flow/buylist',k:'link'}]},
  {id:'s10',t:'核對 SKU 與數量 → 下單',h:'下單前再看一次：SKU 對、數量對、<b>沒貨源的 SKU 確實有現貨</b>',tools:[{l:'大邁寶 採購單',u:DMB+'/warehouse/procure',k:'link'}]},
  {id:'s11',t:'思維完成支付',h:'1688 付款由思維處理，付完才算採購完成',tools:[{l:'1688 待付款',u:'https://trade.1688.com/order/buyer_order_list.htm',k:'link'}]},
  {id:'s12',t:'確認每筆訂單都採購到 → 做隔離 → 待處理訂單歸 0',h:'逐筆核對都有下到單，處理完的單在大邁寶隔離；做完<b>待處理訂單應該是 0</b>，避免跟明天的新單混到',tools:[{l:'大邁寶 訂單處理',u:DMB+'/trade/flow/todo',k:'link'}]}
 ]},
 {name:'深圳倉 掃碼驗貨',steps:[
  {id:'s4',t:'開倉庫端 → 掃碼驗貨 → 今日到貨確認',h:'採購下完單後再驗貨。深圳倉今天到的包裹全部掃過一遍',tools:[{l:'大邁寶 倉庫端',u:DMB+'/',k:'link'}]},
  {id:'s5',t:'到齊的打包，未到齊的做記號',h:'<b>到齊</b> → 直接打包。<b>未到齊</b> → 在包裹上寫<b>日期 ＋ muro貨號</b>，先放著等下一批。兩種通常都會有，都處理完再打勾'}
 ]},
 {name:'收尾追蹤',steps:[
  {id:'s13',t:'昨日隔離訂單：廠商都出貨了嗎？',h:'翻昨天隔離的單，逐筆確認<b>廠商已出貨</b>；還沒出的<b>跟廠商確認</b>',tools:[{l:'1688 已買到的貨',u:'https://trade.1688.com/order/buyer_order_list.htm',k:'link'}]},
  {id:'s15',t:'已打包訂單 → 待入庫：有 2 天前的單嗎？',h:'待入庫裡如果還有 <b>2 天前</b>的單，一樣要追蹤到底卡在哪'},
  {id:'s16',t:'部分入庫的單：SKU 跟現場未到齊的對得上嗎？',h:'系統顯示部分入庫的 SKU，要跟<b>現場未到齊的 SKU</b> 一致；對不上就是有東西漏掃或走錯'},
  {id:'s17',t:'打包中的訂單：非當日的單有沒有袋號？',h:'打包中混到<b>不是今天處理</b>的單，逐筆看袋號。<b>沒有袋號、狀態又是「待發貨」＝ 漏發了，優先處理</b>'},
  {id:'s14',t:'完成出貨',h:'上面四項追蹤都確認正常，今日出貨才算完成'}
 ]}
];
var ALL=[];SECTIONS.forEach(function(s){s.steps.forEach(function(x){ALL.push(x);});});

var PEOPLE=['思維','曉慧','小羅']; // 出貨流程固定三人，不跟打卡名單連動
var who=null;
var state={date:'',steps:{},ans:{},note:''};
var saveTimer=null,sheetReady=false,allRec=null;

function pidx(n){var i=PEOPLE.indexOf(n);if(i<0){i=0;for(var j=0;j<n.length;j++)i=(i*31+n.charCodeAt(j))>>>0;}return i%12;}
function pad(n){return (n<10?'0':'')+n;}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function LS(){return 'muro_ship_'+todayKey();}

(function(){var d=new Date(),w=['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('dateline').textContent=d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日（星期'+w+'）';})();

function buildWho(){
  var r=document.getElementById('whoRow');r.innerHTML='';
  PEOPLE.forEach(function(n){
    var b=document.createElement('button');b.className='opt s-p'+pidx(n)+(who===n?' on':'');b.textContent=n;
    b.onclick=function(){who=n;try{localStorage.setItem('muro_ship_who',n);}catch(e){}
      [].forEach.call(r.children,function(x){x.classList.remove('on');});b.classList.add('on');hideMsg();};
    r.appendChild(b);
  });
}
function hideMsg(){var m=document.getElementById('msg');m.className='';m.style.display='none';}
function showMsg(cls,text){var m=document.getElementById('msg');m.className=cls;m.style.display='block';m.textContent=text;}

function isSkip(s){return !!(s.skipIf&&s.skipIf(state));}
function isDone(s){return !!state.steps[s.id];}
function counts(){var d=0;ALL.forEach(function(s){if(isSkip(s)||isDone(s))d++;});return {d:d,n:ALL.length};}

function render(){
  var host=document.getElementById('secs');host.innerHTML='';
  SECTIONS.forEach(function(sec,si){
    var dn=0;sec.steps.forEach(function(s){if(isSkip(s)||isDone(s))dn++;});
    var wrap=document.createElement('div');wrap.className='sec';
    wrap.innerHTML='<h2><span class="n">第 '+(si+1)+' 段</span>'+esc(sec.name)+'<span class="cnt">'+dn+' / '+sec.steps.length+'</span></h2>';
    var box=document.createElement('div');box.className='steps';
    sec.steps.forEach(function(s){
      var idx=ALL.indexOf(s)+1,skip=isSkip(s),done=isDone(s),rec=state.steps[s.id];
      var el=document.createElement('div');el.className='step'+(done?' done':'')+(skip?' skip':'');
      var html='<div class="ring">'+(done?'✓':(skip?'－':idx))+'</div><div class="body">';
      html+='<div class="ttl">'+esc(s.t)+'</div>';
      if(s.h)html+='<div class="hint">'+s.h+'</div>';
      if(s.opts){
        html+='<div class="pills">'+s.opts.map(function(o){
          var on=state.ans[s.q]===o.v;
          return '<button class="pill'+(on?' on':'')+(o.warn?' warn':'')+'" data-v="'+esc(o.v)+'">'+esc(o.l)+'</button>';
        }).join('')+'</div>';
      }
      if(s.tools&&s.tools.length){
        html+='<div class="tools">'+s.tools.map(function(t){
          return t.u?'<a class="tool link" href="'+t.u+'" target="_blank" rel="noopener">↗ '+esc(t.l)+'</a>':'<span class="tool bat">🖥 '+esc(t.l)+'</span>';
        }).join('')+'</div>';
      }
      if(skip)html+='<div class="stamp">略過（今天沒有新訂單）</div>';
      else if(rec)html+='<div class="stamp">✓ '+esc(rec.t)+'　'+esc(rec.by||'')+(s.q&&state.ans[s.q]?'　→ '+esc(state.ans[s.q]):'')+'</div>';
      html+='</div>';
      el.innerHTML=html;
      if(!skip&&!s.opts){el.onclick=function(e){if(e.target.closest('a'))return;toggle(s);};}
      if(!skip&&s.opts){el.onclick=function(e){if(e.target.closest('a'))return;var p=e.target.closest('.pill');if(!p)return;answer(s,p.getAttribute('data-v'));};}
      box.appendChild(el);
    });
    wrap.appendChild(box);host.appendChild(wrap);
  });
  var c=counts();
  document.getElementById('fill').style.width=Math.round(c.d/c.n*100)+'%';
  document.getElementById('progTxt').textContent=(c.d===c.n?'🎉 今天流程全部完成':'今天完成 '+c.d+' / '+c.n);
  var ta=document.getElementById('note');
  if(document.activeElement!==ta&&ta.value!==(state.note||''))ta.value=state.note||'';
}

function needWho(){if(!who){showMsg('warn','先選一下你是誰再打勾喔');window.scrollTo({top:0,behavior:'smooth'});return true;}return false;}
function toggle(s){
  if(needWho())return;
  if(state.steps[s.id])delete state.steps[s.id];else state.steps[s.id]={t:nowHM(),by:who};
  render();persist();
}
function answer(s,v){
  if(needWho())return;
  if(state.ans[s.q]===v){delete state.ans[s.q];delete state.steps[s.id];}
  else{state.ans[s.q]=v;state.steps[s.id]={t:nowHM(),by:who};}
  if(s.q==='q2'&&v==='沒有'){delete state.steps.s3;}
  render();persist();
}

function statusText(){var c=counts();return c.d===c.n?'完成 '+c.n+'/'+c.n:'進行中 '+c.d+'/'+c.n;}
function persist(){
  state.date=todayKey();state.note=document.getElementById('note').value.trim();
  try{localStorage.setItem(LS(),JSON.stringify(state));}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(pushSheet,600);
}
function pushSheet(){
  var payload={token:TOKEN,action:'logi_save',no:state.date,item:who||'',st:statusText(),
    bag:JSON.stringify({steps:state.steps,ans:state.ans}),note:state.note};
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)})
  .then(function(r){return r.text();})
  .then(function(t){
    if(t==='ok'||t==='updated'){showMsg('good','✅ 已記錄　'+statusText());setTimeout(loadRecords,1500);}
    else showMsg('bad','存不進試算表（'+t.slice(0,40)+'），已先存在這支手機');
  })
  .catch(function(){showMsg('bad','連不上寫入服務，已先存在這支手機，等網路好再點一次任一步');});
}

function parseCSV(text){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'||c==='\r'){if(cur!==''||row.length){row.push(cur);rows.push(row);row=[];cur='';}}
      else cur+=c;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function normDate(s){s=(s||'').trim();var m=s.match(/(\d{4})[\/\-年\.](\d{1,2})[\/\-月\.](\d{1,2})/);
  return m?m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]):null;}

function loadRecords(){
  fetch(SHIP_CSV+'&t='+Math.floor(Math.random()*1e9)).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){
    var rows=parseCSV(t);allRec=[];
    if(!rows.length||(rows[0][0]||'').indexOf('訂單')===-1){sheetReady=false;renderRec();return;} // 分頁尚未建立
    sheetReady=true;
    for(var i=1;i<rows.length;i++){
      var d=normDate(rows[i][0]);if(!d)continue;
      var bag={};try{bag=JSON.parse(rows[i][3]||'{}');}catch(e){}
      allRec.push({date:d,who:(rows[i][1]||'').trim(),st:(rows[i][2]||'').trim(),bag:bag,note:(rows[i][4]||'').trim(),upd:(rows[i][5]||'').trim()});
    }
    var tk=todayKey(),mine=allRec.filter(function(r){return r.date===tk;})[0];
    if(mine&&mine.bag&&mine.bag.steps){
      var local=Object.keys(state.steps).length,remote=Object.keys(mine.bag.steps).length;
      if(remote>=local){state.steps=mine.bag.steps;state.ans=mine.bag.ans||{};
        if(mine.note&&document.activeElement!==document.getElementById('note'))state.note=mine.note;render();}
    }
    renderRec();
    var pd=document.getElementById('pickDate').value;if(pd)showDay(pd);
  }).catch(function(){allRec=[];renderRec();});
}
function renderRec(){
  var list=document.getElementById('recList');
  if(!allRec||!allRec.length){list.className='empty';list.textContent=sheetReady?'還沒有出貨紀錄。':'第一次打勾後，試算表會自動建立「物流」分頁存紀錄。';return;}
  var d=new Date();d.setDate(d.getDate()-13);var start=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  var recs=allRec.filter(function(r){return r.date>=start;}).sort(function(a,b){return a.date<b.date?1:-1;});
  if(!recs.length){list.className='empty';list.textContent='近 14 天沒有出貨紀錄。';return;}
  list.className='';
  list.innerHTML=recs.map(function(r){
    var fin=r.st.indexOf('完成')===0,last='';
    if(r.bag&&r.bag.steps&&r.bag.steps.s14)last=r.bag.steps.s14.t;
    var whoAll={};if(r.bag&&r.bag.steps)Object.keys(r.bag.steps).forEach(function(k){if(r.bag.steps[k].by)whoAll[r.bag.steps[k].by]=1;});
    var names=Object.keys(whoAll).join('・')||r.who;
    return '<div class="trow" data-d="'+r.date+'"><span class="tdate">'+r.date.slice(5).replace('-','/')+'</span><span class="twho">'+esc(names)+'</span>'+
      '<span class="tst '+(fin?'fin':'run')+'">'+esc(r.st)+(fin&&last?'　'+esc(last):'')+'</span>'+
      (r.note?'<span class="tnote" title="'+esc(r.note)+'">'+esc(r.note)+'</span>':'')+'</div>';
  }).join('');
  [].forEach.call(list.querySelectorAll('.trow'),function(el){el.onclick=function(){showDay(el.getAttribute('data-d'));window.scrollTo({top:document.getElementById('pickDate').offsetTop-80,behavior:'smooth'});};});
}

var noteTimer=null;
document.getElementById('note').addEventListener('input',function(){
  state.note=this.value;try{localStorage.setItem(LS(),JSON.stringify(state));}catch(e){}
  clearTimeout(noteTimer);noteTimer=setTimeout(function(){if(who)persist();},1500);
});
document.getElementById('note').addEventListener('blur',function(){clearTimeout(noteTimer);if(who)persist();});
/* ---------- 查某一天 ---------- */
function showDay(d){
  var box=document.getElementById('dayView');
  document.getElementById('pickDate').value=d;
  if(!allRec){box.className='empty';box.textContent='紀錄還在載入…';return;}
  var r=allRec.filter(function(x){return x.date===d;})[0];
  if(!r){box.className='empty';box.textContent=d.slice(5).replace('-','/')+' 這天沒有出貨紀錄。';return;}
  var st=(r.bag&&r.bag.steps)||{},ans=(r.bag&&r.bag.ans)||{};
  var whoAll={};Object.keys(st).forEach(function(k){if(st[k].by)whoAll[st[k].by]=1;});
  var html='<div class="vsum"><b>'+esc(d)+'</b>　'+esc(r.st)+'　'+esc(Object.keys(whoAll).join('・')||r.who)+(r.upd?'<br>最後更新 '+esc(r.upd):'')+'</div>';
  SECTIONS.forEach(function(sec,si){
    html+='<div class="vsec">第 '+(si+1)+' 段　'+esc(sec.name)+'</div>';
    sec.steps.forEach(function(s){
      var rec=st[s.id],skip=!!(s.skipIf&&s.skipIf({ans:ans,steps:st}));
      var cls=rec?'ok':(skip?'skip':'no');
      var right=rec?('✓ '+esc(rec.t)+' '+esc(rec.by||'')+(s.q&&ans[s.q]?' → '+esc(ans[s.q]):'')):(skip?'略過':'未勾');
      html+='<div class="vrow '+cls+'"><div class="vi">'+(rec?'✓':(skip?'－':(ALL.indexOf(s)+1)))+'</div><div class="vt">'+esc(s.t)+'</div><div class="vs">'+right+'</div></div>';
    });
  });
  if(r.note)html+='<div class="vnote">📝 '+esc(r.note)+'</div>';
  box.className='';box.innerHTML=html;
}
(function(){var pd=document.getElementById('pickDate');pd.max=todayKey();
  pd.onchange=function(){if(pd.value)showDay(pd.value);};
  document.getElementById('pickToday').onclick=function(){showDay(todayKey());};})();

document.getElementById('saveBtn').onclick=function(){if(needWho())return;persist();};
document.getElementById('resetBtn').onclick=function(){
  if(!window.confirm('把今天的勾全部清掉重來？紀錄會一起清空。'))return;
  state={date:todayKey(),steps:{},ans:{},note:''};render();persist();
};

// 讀本機暫存
try{var c=JSON.parse(localStorage.getItem(LS())||'null');if(c&&c.date===todayKey())state=c;}catch(e){}
try{who=localStorage.getItem('muro_ship_who')||null;}catch(e){}
state.date=todayKey();

buildWho();render();loadRecords();
setInterval(loadRecords,60000);
</script>
