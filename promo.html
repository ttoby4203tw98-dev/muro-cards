<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a2c3a">
<title>暮若單品活動試算</title>
<style>
:root{
  --plum:#4a2c3a; --plum2:#6b3f52; --rose:#9c5c6e; --gold:#b9824f; --gold-soft:#f3e4d4;
  --bg:#faf6f2; --card:#ffffff; --line:#eaded6; --ink:#2e1f26; --muted:#86727b;
  --ok:#2f7a55; --ok-bg:#e3f2ea; --warn:#a0621a; --warn-bg:#fbeedb; --bad:#b3363f; --bad-bg:#fbe5e6;
  --off:#b9aab1; --input:#fdfbf9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --plum:#e7c9d6; --plum2:#d4a9bc; --rose:#d995aa; --gold:#e0b183; --gold-soft:#3a2c22;
    --bg:#1c1418; --card:#261b21; --line:#3b2c34; --ink:#f2e9ed; --muted:#a8949e;
    --ok:#7fd1a4; --ok-bg:#1d3328; --warn:#e8b36a; --warn-bg:#3a2b17; --bad:#f08a90; --bad-bg:#3d1d21;
    --off:#6e5c65; --input:#20171c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plum:#e7c9d6; --plum2:#d4a9bc; --rose:#d995aa; --gold:#e0b183; --gold-soft:#3a2c22;
  --bg:#1c1418; --card:#261b21; --line:#3b2c34; --ink:#f2e9ed; --muted:#a8949e;
  --ok:#7fd1a4; --ok-bg:#1d3328; --warn:#e8b36a; --warn-bg:#3a2b17; --bad:#f08a90; --bad-bg:#3d1d21;
  --off:#6e5c65; --input:#20171c;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;line-height:1.55}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:24px;color:var(--plum);letter-spacing:.02em}
h2{margin:0 0 8px;font-size:16px;color:var(--plum)}
.lede{margin:4px 0 0;color:var(--muted);max-width:64ch}
.num{font-variant-numeric:tabular-nums}
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--plum2);background:var(--plum2);color:var(--bg);padding:7px 14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}

.step{display:flex;flex-direction:column;gap:6px}
.step>label,.lbl{font-size:12px;color:var(--muted);letter-spacing:.05em}
.pick{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pick input[type=text]{flex:1 1 260px}
.pick .chk{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:center}
.item{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px 14px;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.item div{display:flex;flex-direction:column}
.item .k{font-size:11.5px;color:var(--muted)}
.item .v{font-weight:600}
.item .title{grid-column:1/-1;font-size:15px;font-weight:700;color:var(--plum)}
.item .title a{font-size:12.5px;font-weight:400;color:var(--rose);margin-left:8px}

.types{display:flex;flex-wrap:wrap;gap:8px}
.types button{background:transparent;color:var(--plum2);border-color:var(--line);padding:6px 12px}
.types button[aria-pressed="true"]{background:var(--plum2);color:var(--bg);border-color:var(--plum2)}
.types .grp{font-size:11.5px;color:var(--muted);align-self:center;margin-left:4px}

.budget{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.budget input[type=range]{flex:1 1 240px;accent-color:var(--plum2)}
.budget input[type=number]{width:80px}
.budget .max{font-size:12.5px;color:var(--muted)}

.result{border:2px solid var(--plum2);border-radius:12px;padding:18px;background:var(--card);display:flex;flex-direction:column;gap:12px}
.headline{font-size:22px;font-weight:700;color:var(--plum);line-height:1.35;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--gold-soft);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column}
.fact .k{font-size:11.5px;color:var(--muted)}
.fact .v{font-size:17px;font-weight:700}
.fact.ok .v{color:var(--ok)} .fact.warn .v{color:var(--warn)} .fact.bad{background:var(--bad-bg)} .fact.bad .v{color:var(--bad)}
.note{font-size:12.5px;color:var(--muted)}
.sub{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sub input{width:80px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
tr.no td{color:var(--off)}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
.copyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#copyMsg{color:var(--ok);font-size:13px}
footer{font-size:12px;color:var(--muted)}
.area{display:flex;flex-direction:column;gap:18px}
.back{display:inline-block;margin-bottom:6px;color:var(--rose);text-decoration:none;font-size:13px}
.calc{display:flex;flex-direction:column;gap:12px}
.calc .row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.calc .row input{width:90px}
.calc td.hl{font-weight:700;color:var(--plum)}
.calc table{min-width:0}
.calc .fld{display:flex;align-items:center;gap:6px}
.calc tr.rec td{background:var(--gold-soft)}
</style>

<div class="wrap">
  <header>
<a class="back" href="https://ttoby4203tw98-dev.github.io/muro-cards/team.html">‹ 暮若團隊</a>
    <h1>暮若單品活動試算</h1>
    <p class="lede">選貨號、選活動、填活動的數字（搶購價、券面額、蝦幣⋯），直接看到折完的利潤。定價已經預留 5% 做活動，讓利超過售價 5% 的部分才會扣到利潤。</p>
  </header>

  <section class="panel lock" id="lockBox" hidden>
    <h2>單品活動試算需要密碼</h2>
    <p class="lede" style="margin:0 0 10px">這區含商品成本，只給管理層看。最下面的售價試算不用密碼。</p>
    <form class="pick" id="lockForm">
      <input type="password" id="pw" placeholder="輸入密碼" autocomplete="current-password" style="flex:1 1 200px">
      <label class="chk"><input type="checkbox" id="pwKeep" checked>記住這台裝置</label>
      <button type="submit">解鎖</button>
    </form>
    <p id="pwMsg" class="note" role="status" style="margin:8px 0 0"></p>
  </section>

  <div id="itemArea" class="area">
  <section class="panel step">
    <label for="sku">① muro 貨號</label>
    <div class="pick">
      <input type="text" id="sku" list="skuList" placeholder="輸入貨號，例如 1030" autocomplete="off">
      <datalist id="skuList"></datalist>
      <label class="chk"><input type="checkbox" id="showOff">包含下架商品</label>
    </div>
    <div id="itemBox"></div>
  </section>

  <section class="panel step">
    <span class="lbl">② 活動類型</span>
    <div class="types" id="types" role="group" aria-label="活動類型"></div>
  </section>

  <section class="panel step">
    <span class="lbl">③ 活動內容</span>
    <div class="budget" id="inBox"></div>
    <span class="max" id="bMax"></span>
  </section>

  <section class="result" id="result" aria-live="polite"></section>

  <section class="copyrow">
    <button id="copyBtn" type="button">複製這個活動</button><span id="copyMsg" role="status"></span>
  </section>
  </div>

  <section class="panel calc" aria-labelledby="calcTitle">
    <div>
      <h2 id="calcTitle">售價試算</h2>
      <p class="lede" style="margin:0">孤品或新品還沒進商品庫時用。輸入 1688 成本和重量，就會算出建議售價和利潤率。</p>
    </div>
    <div class="row">
      <span class="fld"><label for="cCost" class="lbl" style="letter-spacing:0">商品成本</label><input type="number" id="cCost" min="0" step="0.5" value="20"><span>人民幣</span></span>
      <span class="fld"><label for="cW" class="lbl" style="letter-spacing:0">重量</label><input type="number" id="cW" min="0" step="10" value="200"><span>公克</span></span>
    </div>
    <div id="calcOut"></div>
    <div class="row">
      <label for="cPrice" class="lbl" style="letter-spacing:0">想賣多少？</label><input type="number" id="cPrice" min="0" step="1" placeholder="直播價"><span>元</span>
      <span id="cPriceOut"></span>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

zYeEO3OXTMLi8P8=","n":250000};
const P = DATA.params;
const fmt = n => Math.round(n).toLocaleString("zh-TW");
const pct = x => (x*100).toFixed(1)+"%";
const $ = id => document.getElementById(id);
let byId = {};
const isOff = p => /下架/.test(p.status);
const usable = p => p.L && p.cost;

/* 成本(人民幣)：一單固定費只算一次，重量照總重 */
const orderCost = items => items.reduce((s,x)=>s+x.cost+x.w*P.perKg,0) + P.fixed;
/* 定價公式：利潤率 = (售價×0.6 − 總成本×匯率) ÷ 售價 */
const profitAt = (price, costRMB) => (price*P.net - costRMB*P.rate)/price;
/* 活動預算 b(讓利 ÷ 原價)：超過預留 5% 的部分直接從利潤扣 */
const afterBudget = (p0, b) => p0 - (b - P.reserve);
const bMaxFor = p0 => Math.max(0, p0 - P.floor + P.reserve);
const level = m => m < P.floor ? "bad" : m < P.target ? "warn" : "ok";
const levelText = m => m < P.floor ? "低於門檻 18.5%" : m < P.target ? "低於目標 24.5%" : "達標";

const TYPES = [
  {k:"down",   name:"直播降價／搶購"},
  {k:"coupon", name:"商品優惠券"},
  {k:"coins",  name:"蝦幣回饋"},
  {k:"gift",   name:"見面禮／贈品"},
  {k:"addon",  name:"加價購"},
  {k:"combo",  name:"組合價"},
];

let S = {sku:"", type:"down", showOff:false, n:2, addon:"", v:{}, vSku:""};
try{ Object.assign(S, JSON.parse(localStorage.getItem("muro-item-promo-v2")||"{}")); }catch(e){}
const save = () => { try{ localStorage.setItem("muro-item-promo-v2", JSON.stringify(S)); }catch(e){} };
if(!TYPES.some(t=>t.k===S.type)) S.type = "down";

/* 各活動預設值：約等於 5% 預算(剛好用掉定價預留的活動費) */
function defaultV(k){
  const p = byId[S.sku], a = byId[S.addon];
  switch(k){
    case "down":   return Math.round(p.L*0.95);
    case "coupon": return Math.round(p.L*0.05);
    case "coins":  return Math.round(p.L*0.05);
    case "gift":   return 5;
    case "addon":  return a ? Math.round(a.L - (p.L+a.L)*0.05) : 0;
    case "combo":  return Math.round(p.L*S.n*0.95);
  }
}
const val = k => (S.v[k] ?? (S.v[k] = defaultV(k)));

function label(p){ return `${p.id}｜${p.tab} ${p.desc}｜直播 ${fmt(p.L)}${isOff(p)?"｜下架":""}`; }
function fillList(){
  $("skuList").innerHTML = DATA.products.filter(p=>S.showOff||!isOff(p)).map(p=>`<option value="${label(p)}"></option>`).join("");
}
function parseSku(v){ const id = String(v).split("｜")[0].trim(); return byId[id] ? id : null; }
function selectSku(id){ S.sku=id; S.v={}; S.vSku=id; renderItem(); renderInputs(); update(); }

function renderItem(){
  const p = byId[S.sku];
  if(!p){ $("itemBox").innerHTML = `<div class="empty" style="margin-top:10px">找不到這個貨號，請從清單選。</div>`; return; }
  const tot = orderCost([p]);
  $("itemBox").innerHTML = `<div class="item">
    <div class="title">${p.id} ${p.tab}${p.desc?" · "+p.desc:""}${p.shopee?`<a href="${p.shopee}" target="_blank" rel="noopener">蝦皮頁面</a>`:""}</div>
    <div><span class="k">狀態</span><span class="v">${p.status||"—"}</span></div>
    <div><span class="k">賣場價</span><span class="v num">${fmt(p.S)}</span></div>
    <div><span class="k">直播價</span><span class="v num">${fmt(p.L)}${p.zhe?"":` <small style="font-weight:400;color:var(--muted)">(沒填折數)</small>`}</span></div>
    <div><span class="k">商品成本 ¥</span><span class="v num">${p.cost}</span></div>
    <div><span class="k">重量 g</span><span class="v num">${Math.round(p.w*1000)}</span></div>
    <div><span class="k">總成本 ¥</span><span class="v num">${tot.toFixed(2)}</span></div>
    <div><span class="k">直播利潤率</span>${usable(p)?`<span class="v num" style="color:var(--${level(profitAt(p.L,tot))})">${pct(profitAt(p.L,tot))}</span>`:`<span class="v">—</span>`}</div>
  </div>`;
}

function renderTypes(){
  $("types").innerHTML = TYPES.map(t=>`<button type="button" data-k="${t.k}" aria-pressed="${S.type===t.k}">${t.name}</button>`).join("");
  $("types").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.type=b.dataset.k; renderTypes(); renderInputs(); update(); });
}

/* ③ 依活動類型換輸入欄；只在換商品/換類型時重建，打字時不重建以免跳掉游標 */
const numIn = (id, lab, v, unit, step=1) =>
  `<label for="${id}" class="lbl" style="letter-spacing:0">${lab}</label><input type="number" id="${id}" min="0" step="${step}" value="${v}"><span>${unit}</span>`;
function renderInputs(){
  const p = byId[S.sku], box = $("inBox");
  if(!p || !usable(p)){ box.innerHTML=""; return; }
  const t = S.type;
  if(t==="down")   box.innerHTML = numIn("vIn","搶購價", val("down"), "元");
  if(t==="coupon") box.innerHTML = numIn("vIn","券面額", val("coupon"), "元");
  if(t==="coins")  box.innerHTML = numIn("vIn","回饋蝦幣", val("coins"), "枚");
  if(t==="gift")   box.innerHTML = numIn("vIn","贈品成本上限（含重量運費）", val("gift"), "人民幣", 0.5);
  if(t==="combo")  box.innerHTML = numIn("nIn","同款件數", S.n, "件") + numIn("vIn","組合價（整組）", val("combo"), "元");
  if(t==="addon"){
    const opts = DATA.products.filter(x=>x.id!==p.id && usable(x) && (S.showOff||!isOff(x)))
      .map(x=>`<option value="${x.id}" ${x.id===S.addon?"selected":""}>${label(x)}</option>`).join("");
    box.innerHTML = `<label for="addonSel" class="lbl" style="letter-spacing:0">加購品</label><select id="addonSel" style="flex:1 1 260px"><option value="">— 選擇 —</option>${opts}</select>`+
      (byId[S.addon] ? numIn("vIn","加購價", val("addon"), "元") : "");
  }
  const vIn=$("vIn"); if(vIn) vIn.oninput=e=>{ S.v[S.type]=+e.target.value||0; update(); };
  const nIn=$("nIn"); if(nIn) nIn.oninput=e=>{ S.n=Math.max(2,Math.round(+e.target.value||2)); S.v.combo=defaultV("combo"); $("vIn").value=S.v.combo; update(); };
  const sel=$("addonSel"); if(sel) sel.onchange=e=>{ S.addon=e.target.value; delete S.v.addon; renderInputs(); update(); };
}

function fact(k, v, cls=""){ return `<div class="fact ${cls}"><span class="k">${k}</span><span class="v num">${v}</span></div>`; }
function profitFacts(b, p0, after){
  return fact("等於預算", pct(b)) + fact("活動前利潤", pct(p0)) + fact("活動後利潤", pct(after), level(after)) + fact("判定", levelText(after), level(after));
}

let copyText = "";
function update(){
  const p = byId[S.sku], R = $("result"), M = $("bMax");
  copyText=""; M.innerHTML="";
  if(!p){ R.innerHTML = `<div class="empty">先選一個貨號。</div>`; save(); return; }
  if(!usable(p)){ R.innerHTML = `<div class="empty">${p.id} 在商品庫沒有填${!p.cost?"商品成本":"價格"}，算不出利潤。請先補商品庫。</div>`; save(); return; }
  const tot1 = orderCost([p]), t = S.type, name = `${p.id} ${p.tab}`;
  const single = profitAt(p.L, tot1);
  let html = "", b, p0 = single, after, v = S.v[t];

  if(t==="down"){
    b = (p.L - v)/p.L; after = afterBudget(p0, b);
    html = `<div class="headline">直播價 ${fmt(p.L)} → <span style="color:var(--rose)">${fmt(v)}</span></div>
      <div class="facts">${fact("讓利", fmt(p.L-v)+" 元")}${profitFacts(b,p0,after)}</div>`;
    M.innerHTML = `搶購價最低 <b>${fmt(Math.ceil(p.L*(1-bMaxFor(p0))))}</b> 元，再低就低於 18.5%`;
    copyText = `${name}｜直播搶購 ${fmt(v)} 元（原 ${fmt(p.L)}，活動後利潤 ${pct(after)}）`;
  }
  else if(t==="coupon" || t==="coins"){
    b = v/p.L; after = afterBudget(p0, b);
    const head = t==="coupon" ? `此商品專屬券：折 ${fmt(v)} 元` : `下單回饋 ${fmt(v)} 蝦幣`;
    html = `<div class="headline">${head}</div><div class="facts">${profitFacts(b,p0,after)}</div>
      <div class="note">${t==="coupon"?"假設每張券都會被用掉（最保守）。可以設成直播間限定或此商品限定。":"1 蝦幣 = 1 元。蝦幣是下單後才發，買家看到的價格不變。"}</div>`;
    M.innerHTML = `${t==="coupon"?"面額":"蝦幣"}最多 <b>${fmt(Math.floor(p.L*bMaxFor(p0)))}</b>，再多就低於 18.5%`;
    copyText = `${name}｜${head}（活動後利潤 ${pct(after)}）`;
  }
  else if(t==="gift"){
    b = v*P.rate/p.L; after = afterBudget(p0, b);
    M.innerHTML = `贈品成本最多 <b>¥${(p.L*bMaxFor(p0)/P.rate).toFixed(1)}</b>，再多就低於 18.5%`;
    let list;
    if(!DATA.gifts.length){
      list = `<div class="empty">商品庫的「贈品」分頁還沒有資料。填好後跟 Claude 說「重抓贈品」，這裡就會列出能發的贈品。</div>`;
      copyText = `${name}｜見面禮/贈品：成本 ¥${v} 以內（活動後利潤 ${pct(after)}）`;
    }else{
      const rows = DATA.gifts.map(g=>{ const c = g.cost + g.w*P.perKg; return {g, c, m:afterBudget(p0, c*P.rate/p.L), fit:c<=v+1e-9}; })
        .sort((a,b)=>(b.fit-a.fit)||(b.c-a.c));
      const fits = rows.filter(r=>r.fit);
      list = `<div class="note">共 ${rows.length} 款贈品，<b>${fits.length}</b> 款在上限內。贈品隨單寄出，只加贈品成本和重量運費，不另算固定費。</div>
      <div class="tbl-wrap"><table><tr><th>貨號</th><th>品名</th><th>成本 ¥</th><th>重量 g</th><th>含運 ¥</th><th>送了之後利潤</th></tr>
      ${rows.map(r=>`<tr class="${r.fit?"":"no"}"><td>${r.g.id}</td><td>${r.g.desc||r.g.tab}</td><td>${r.g.cost}</td><td>${Math.round(r.g.w*1000)}</td><td>${r.c.toFixed(1)}</td>
        <td>${r.fit?`<span class="chip ${level(r.m)}">${pct(r.m)}</span>`:"超出上限"}</td></tr>`).join("")}</table></div>`;
      copyText = `${name}｜見面禮/贈品可發：${fits.map(r=>r.g.id+(r.g.desc?" "+r.g.desc:"")).join("、")||"無符合"}（成本 ¥${v} 以內）`;
    }
    html = `<div class="headline">送成本 ¥${v} 以內的贈品</div><div class="facts">${fact("約合台幣", fmt(v*P.rate)+" 元")}${profitFacts(b,p0,after)}</div>${list}`;
  }
  else if(t==="combo"){
    const n = S.n, R0 = p.L*n, c = orderCost(Array(n).fill(p));
    p0 = profitAt(R0, c); b = (R0 - v)/R0; after = afterBudget(p0, b);
    html = `<div class="headline">同款 ${n} 件 <span style="color:var(--rose)">${fmt(v)}</span> 元（每件 ${fmt(v/n)}）</div>
      <div class="facts">${fact(`原價 ${n} 件`, fmt(R0)+" 元")}${fact("讓利", fmt(R0-v)+" 元")}${fact("整單總成本", "¥"+c.toFixed(2))}${profitFacts(b,p0,after)}</div>
      <div class="note">多件共用一單固定費 ¥${P.fixed}（進店費 2.5 + 包材 1），所以 ${n} 件的活動前利潤 ${pct(p0)}，比單件 ${pct(single)} 高 ${((p0-single)*100).toFixed(1)} 個百分點。</div>`;
    M.innerHTML = `${n} 件組合價最低 <b>${fmt(Math.ceil(R0*(1-bMaxFor(p0))))}</b> 元，再低就低於 18.5%`;
    copyText = `${name}｜組合價 ${n} 件 ${fmt(v)} 元（原 ${fmt(R0)}，活動後利潤 ${pct(after)}）`;
  }
  else if(t==="addon"){
    const a = byId[S.addon];
    if(!a){ R.innerHTML = `<div class="empty">在上面選一個加購品。</div>`; save(); return; }
    const R0 = p.L + a.L, c = orderCost([p,a]);
    p0 = profitAt(R0, c); b = (a.L - v)/R0; after = afterBudget(p0, b);
    html = `<div class="headline">買 ${p.id} 加 <span style="color:var(--rose)">${fmt(v)}</span> 元換購 ${a.id} ${a.tab}（原 ${fmt(a.L)}）</div>
      <div class="facts">${fact("整單原價", fmt(R0)+" 元")}${fact("讓利", fmt(a.L-v)+" 元")}${fact("整單總成本", "¥"+c.toFixed(2))}${profitFacts(b,p0,after)}</div>
      <div class="note">兩件同一單寄，固定費只算一次。</div>`;
    M.innerHTML = `加購價最低 <b>${fmt(Math.ceil(a.L - R0*bMaxFor(p0)))}</b> 元，再低就低於 18.5%`;
    copyText = `${name}｜加價購：加 ${fmt(v)} 元換購 ${a.id} ${a.tab}（原 ${fmt(a.L)}，活動後利潤 ${pct(after)}）`;
  }

  R.innerHTML = html;
  save();
}

/* ── 單品區啟動(資料到位後才跑) ── */
function startItems(){
byId = Object.fromEntries(DATA.products.map(p=>[p.id,p]));
if(!byId[S.sku]) S.sku = (DATA.products.find(p=>!isOff(p)&&usable(p))||DATA.products[0]||{}).id || "";
$("lockBox").hidden = true; $("itemArea").hidden = false;
fillList();
$("showOff").checked = S.showOff;
$("showOff").onchange = e=>{ S.showOff=e.target.checked; fillList(); renderInputs(); update(); };
$("sku").value = byId[S.sku] ? label(byId[S.sku]) : "";
$("sku").oninput = e=>{ const id=parseSku(e.target.value); if(id && id!==S.sku) selectSku(id); };
$("sku").onchange = e=>{ const id=parseSku(e.target.value); if(id){ e.target.value=label(byId[id]); if(id!==S.sku) selectSku(id); } };
$("copyBtn").onclick = ()=>{
  if(!copyText){ $("copyMsg").textContent="還沒有可複製的內容"; return; }
  navigator.clipboard.writeText(copyText).then(()=>$("copyMsg").textContent="已複製",()=>$("copyMsg").textContent=copyText);
  setTimeout(()=>$("copyMsg").textContent="",4000);
};
$("foot").textContent = footText();
if(S.vSku!==S.sku){ S.v={}; S.vSku=S.sku; }
renderTypes(); renderItem(); renderInputs(); update();
}
const footText = () => `商品庫資料抓取時間 ${DATA.updated}・商品 ${DATA.products.length} 筆・贈品 ${DATA.gifts.length} 筆・參數：固定費 ¥${P.fixed}、每公斤 ¥${P.perKg}、匯率 ${P.rate}、預留活動 ${P.reserve*100}%`;

/* ── 密碼解鎖：商品資料用 AES-GCM 加密，密碼錯就解不開 ── */
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:unb64(ENC.s), iterations:ENC.n, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(ENC.i)}, key, unb64(ENC.c));
  const d = JSON.parse(new TextDecoder().decode(plain));
  DATA.products = d.products; DATA.gifts = d.gifts;
}
const PWKEY = "muro-promo-pw";
async function tryUnlock(pw, keep){
  try{ await unlock(pw); }catch(e){ return false; }
  try{ keep ? localStorage.setItem(PWKEY, pw) : localStorage.removeItem(PWKEY); }catch(e){}
  startItems(); return true;
}
/* ── 售價試算：反推「利潤率 = m」的直播價，再進位到尾數 9 ── */
const nice9 = x => Math.max(9, Math.ceil((x+1)/10)*10 - 1);
const ZHE = P.liveZhe || 0.75;
function calcPrice(){
  const c = +$("cCost").value||0, w = (+$("cW").value||0)/1000, tot = c + P.fixed + w*P.perKg;
  if(!c){ $("calcOut").innerHTML = `<div class="empty">先輸入商品成本。</div>`; $("cPriceOut").textContent=""; return; }
  const rows = [["最低（18.5% 門檻）",P.floor,""],["建議（目標 24.5%）",P.target,"rec"],["高利潤（30.5%）",0.305,""]].map(([name,m,cls])=>{
    const L = nice9(tot*P.rate/(P.net-m)), S0 = nice9(L/ZHE);
    return `<tr class="${cls}"><td>${name}</td><td class="${cls?"hl":""}">${fmt(L)}</td><td>${fmt(S0)}</td><td><span class="chip ${level(profitAt(L,tot))}">${pct(profitAt(L,tot))}</span></td></tr>`;
  }).join("");
  $("calcOut").innerHTML = `<div class="note">總成本 ¥${tot.toFixed(2)} = 成本 ${c} + 固定費 ${P.fixed} + 重量 ${fmt(w*1000)} 克 × ¥${P.perKg}/公斤</div>
    <div class="tbl-wrap"><table><tr><th>檔位</th><th>直播價</th><th>賣場價</th><th>利潤率</th></tr>${rows}</table></div>
    <div class="note">賣場價 = 直播價 ÷ ${ZHE}。價格一律進位到尾數 9，所以實際利潤率會比檔位略高。</div>`;
  const pr = +$("cPrice").value||0;
  if(pr){ const m = profitAt(pr, tot); $("cPriceOut").innerHTML = `利潤率 <span class="chip ${level(m)}">${pct(m)}</span> ${levelText(m)}・賣場價可標 ${fmt(nice9(pr/ZHE))}`; }
  else $("cPriceOut").textContent = "";
}
["cCost","cW","cPrice"].forEach(id=>$(id).oninput=calcPrice);
calcPrice();

if(ENC){
  $("itemArea").hidden = true; $("lockBox").hidden = false;
  $("foot").textContent = `參數：固定費 ¥${P.fixed}、每公斤 ¥${P.perKg}、匯率 ${P.rate}`;
  $("lockForm").onsubmit = async e=>{ e.preventDefault(); $("pwMsg").textContent="解鎖中⋯";
    $("pwMsg").textContent = await tryUnlock($("pw").value, $("pwKeep").checked) ? "" : "密碼不對，請再試一次。"; };
  let saved=""; try{ saved = localStorage.getItem(PWKEY)||""; }catch(e){}
  if(saved) tryUnlock(saved, true);
}else startItems();
</script>
