<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f9f9f7">
<title>暮若 MURO · 經營儀表板</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb;
  --page:#f9f9f7;
  --text-1:#0b0b0b;
  --text-2:#52514e;
  --muted:#898781;
  --grid:#e1e0d9;
  --axis:#c3c2b7;
  --border:rgba(11,11,11,0.10);
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.05);
  --s1:#2a78d6;  /* 入賬 / 收入 */
  --s2:#eb6834;  /* 支出 */
  --s3:#1baf7a;  /* 損益 / 淨額 */
  --s4:#eda100;
  --good:#006300;
  --bad:#d03b3b;
  --wash:rgba(11,11,11,.04);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d; --text-1:#ffffff; --text-2:#c3c2b7;
    --muted:#898781; --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --good:#0ca30c; --bad:#e66767; --wash:rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --page:#0d0d0d; --text-1:#ffffff; --text-2:#c3c2b7;
  --muted:#898781; --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good:#0ca30c; --bad:#e66767; --wash:rgba(255,255,255,.06);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--text-1);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--page);padding-bottom:86px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--page) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}
.brand{font-size:17px;font-weight:650;letter-spacing:.04em}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.14em;margin-top:1px}
.hd .sp{flex:1}
.iconbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-1);
  color:var(--text-2);font-size:15px;cursor:pointer;display:grid;place-items:center;line-height:1
}
.iconbtn:active{transform:scale(.94)}
.updated{font-size:11px;color:var(--muted);padding:0 16px 10px;letter-spacing:.02em}

/* ---------- segmented ---------- */
.seg{display:flex;gap:4px;background:var(--wash);border-radius:11px;padding:3px}
.seg button{
  flex:1;border:0;background:transparent;color:var(--text-2);font:inherit;font-size:13px;font-weight:550;
  padding:7px 4px;border-radius:9px;cursor:pointer;white-space:nowrap
}
.seg button[aria-selected="true"]{background:var(--surface-1);color:var(--text-1);box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* ---------- layout ---------- */
main{padding:14px 16px 8px;display:flex;flex-direction:column;gap:14px}
.card{
  background:var(--surface-1);border:1px solid var(--border);border-radius:16px;padding:15px 15px 13px;
  box-shadow:var(--shadow)
}
.card>h3{
  margin:0 0 2px;font-size:14px;font-weight:620;letter-spacing:.01em;display:flex;align-items:center;gap:8px
}
.card>h3 .sp{flex:1}
.sub{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.tablebtn{
  border:1px solid var(--border);background:transparent;color:var(--text-2);font:inherit;font-size:11px;
  padding:3px 9px;border-radius:99px;cursor:pointer
}
.tablebtn[aria-pressed="true"]{background:var(--wash);color:var(--text-1)}

/* ---------- hero ---------- */
.hero{padding:18px 15px 15px}
.hero .lab{font-size:12px;color:var(--muted);letter-spacing:.06em}
.hero .val{font-size:clamp(38px,12vw,50px);font-weight:680;letter-spacing:-.02em;line-height:1.06;margin:6px 0 0}
.hero .val .cur{font-size:.42em;font-weight:600;color:var(--text-2);margin-right:.18em;vertical-align:.28em}
.hero .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px}
.delta{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.delta .n{font-size:11.5px;font-weight:500;color:var(--muted)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:12px 12px 11px;box-shadow:var(--shadow)}
.tile .lab{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;letter-spacing:.02em}
.tile .dot{width:8px;height:8px;border-radius:99px;flex:none}
.tile .val{font-size:20px;font-weight:640;letter-spacing:-.01em;margin-top:5px;line-height:1.2}
.tile .val small{font-size:11px;font-weight:550;color:var(--text-2);margin-right:2px}
.tile .d{font-size:11px;margin-top:3px;color:var(--muted)}
.tile .d b{font-weight:600}
.tiles.t3 .val{font-size:17px;white-space:nowrap}
.tiles.t3 .d{font-size:10px;white-space:nowrap}
.tiles.t3 .delta{font-size:10.5px}
.tiles.t3 .delta .n{font-size:10px}
.tiles.t3 .lab{font-size:11px}

/* ---------- wallet ---------- */
.wallet .top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.wallet .badge{
  font-size:10.5px;font-weight:650;letter-spacing:.06em;padding:3px 8px;border-radius:7px;
  background:var(--wash);color:var(--text-2);flex:none;margin-top:2px
}
.wallet .bal{font-size:11.5px;color:var(--muted)}
.wallet .balv{font-size:24px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.wrow{display:flex;gap:0;border-top:1px solid var(--border);padding-top:11px;margin-top:2px}
.wrow>div{flex:1;min-width:0}
.wrow .k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.wrow .v{font-size:16px;font-weight:620;margin-top:3px;letter-spacing:-.01em}
.bar-mini{display:flex;gap:2px;height:6px;border-radius:99px;overflow:hidden;margin-top:12px}
.bar-mini i{display:block;height:100%}

/* ---------- charts ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 10px;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .sw.line{height:3px;border-radius:99px;width:14px}

#tip{
  position:fixed;z-index:99;pointer-events:none;opacity:0;transform:translate(-50%,-118%);
  background:var(--surface-1);border:1px solid var(--border);border-radius:11px;padding:8px 10px;
  box-shadow:0 6px 24px rgba(0,0,0,.16);font-size:12px;min-width:104px;transition:opacity .1s
}
#tip .t{font-weight:620;margin-bottom:5px;font-size:11.5px;color:var(--text-1)}
#tip .r{display:flex;align-items:center;gap:7px;margin-top:3px;color:var(--text-2);white-space:nowrap}
#tip .r .sw{width:8px;height:8px;border-radius:2px;flex:none}
#tip .r b{margin-left:auto;font-weight:620;color:var(--text-1);font-variant-numeric:tabular-nums}

/* ---------- table view ---------- */
table.dv{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
table.dv th,table.dv td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
table.dv th:first-child,table.dv td:first-child{text-align:left;font-variant-numeric:normal}
table.dv th{color:var(--muted);font-weight:550;font-size:11px}
[hidden]{display:none!important}

/* ---------- list ---------- */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.list li:last-child{border-bottom:0;padding-bottom:2px}
.list .rank{width:19px;height:19px;border-radius:6px;background:var(--wash);color:var(--text-2);font-size:10.5px;font-weight:650;display:grid;place-items:center;flex:none}
.list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .num{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.list .sm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;width:58px;text-align:right;flex:none}
.pill{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--wash);color:var(--text-2);flex:none}

/* ---------- chips ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  flex:none;border:1px solid var(--border);background:transparent;color:var(--text-2);font:inherit;
  font-size:12.5px;font-weight:550;padding:6px 13px;border-radius:99px;cursor:pointer;white-space:nowrap
}
.chips button[aria-selected="true"]{background:var(--text-1);color:var(--surface-1);border-color:var(--text-1)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 8px;margin-top:2px}
.kv .k{font-size:11px;color:var(--muted);white-space:nowrap}
.kv .v{font-size:16px;font-weight:640;letter-spacing:-.01em;margin-top:2px;white-space:nowrap}
.kv .v small{font-size:10.5px;font-weight:550;color:var(--text-2);margin-right:2px}
.src{font-size:10.5px;color:var(--muted);margin:2px 0 0;line-height:1.6}
.src a{color:var(--s1);text-decoration:none}

/* ---------- tabbar ---------- */
nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--page) 90%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)
}
nav.tabbar .in{max-width:520px;margin:0 auto;display:flex}
nav.tabbar button{
  flex:1;border:0;background:transparent;font:inherit;padding:9px 0 11px;cursor:pointer;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px
}
nav.tabbar button[aria-selected="true"]{color:var(--s1)}
nav.tabbar svg{width:22px;height:22px}
nav.tabbar span{font-size:10.5px;font-weight:600;letter-spacing:.04em}

.note{font-size:11px;color:var(--muted);text-align:center;padding:6px 20px 4px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
"use strict";
/* ============================================================
   暮若 MURO — 老闆版儀表板（打樣）
   所有數字皆為假資料，集中在 DB 物件，之後接真實資料只需替換 DB。
   ============================================================ */

/* 資料由 data.js 提供（update.py 自動產生，勿手改） */

/* ============================================================
   工具
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const sum = a=>a.reduce((x,y)=>x+y,0);

function fmtC(n){ // 緊湊：萬 / 億
  const s = n<0?"-":""; n = Math.abs(n);
  if(n>=1e8) return s+(n/1e8).toFixed(2).replace(/\.?0+$/,"")+"億";
  if(n>=1e4) return s+(n/1e4).toFixed(n>=1e6?0:1).replace(/\.0$/,"")+"萬";
  return s+Math.round(n).toLocaleString("en-US");
}
const fmtN = n=>Math.round(n).toLocaleString("en-US");
function pct(cur,prev){ if(!prev) return null; return (cur-prev)/Math.abs(prev)*100; }
function deltaHTML(cur,prev,label,goodUp=true){
  const p = pct(cur,prev); if(p===null) return "";
  const up = p>=0, good = goodUp?up:!up;
  return `<span class="delta ${good?"up":"down"}">${up?"▲":"▼"} ${Math.abs(p).toFixed(1)}%</span> <span class="n">vs ${label}</span>`;
}
function niceMax(v){
  if(v<=0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v/e;
  const m = f<=1?1:f<=1.2?1.2:f<=1.5?1.5:f<=2?2:f<=2.5?2.5:f<=3?3:f<=4?4:f<=5?5:f<=6?6:f<=8?8:10;
  return m*e;
}
function roundTopPath(x,y,w,h,r){
  r = Math.max(0, Math.min(r, w/2, h));
  if(h<=0.4) return "";
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
function roundRightPath(x,y,w,h,r){
  r = Math.max(0, Math.min(r, w, h/2));
  if(w<=0.4) return "";
  return `M${x},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x},${y+h} Z`;
}
const SVGNS="http://www.w3.org/2000/svg";
function sv(t,a){const e=document.createElementNS(SVGNS,t); for(const k in a) e.setAttribute(k,a[k]); return e;}
function cssVar(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || v; }

/* ---------- tooltip ---------- */
const tip = $("#tip");
function showTip(x,y,title,rows){
  tip.innerHTML = `<div class="t">${title}</div>` + rows.map(r=>
    `<div class="r">${r.c?`<span class="sw" style="background:${r.c}"></span>`:""}${r.k}<b>${r.v}</b></div>`).join("");
  tip.style.left = x+"px"; tip.style.top = y+"px"; tip.style.opacity = 1;
}
function hideTip(){ tip.style.opacity = 0; }
document.addEventListener("scroll", hideTip, true);

/* ============================================================
   圖表：直向長條（可群組 / 堆疊）
   ============================================================ */
function columnChart(host, o){
  host.innerHTML="";
  const W = host.clientWidth || 320, H = o.height||190;
  const PL = o.padLeft ?? 46, PR = 10, PT = 14, PB = 24;
  const n = o.cats.length, S = o.series;
  const stacked = !!o.stacked;
  const vals = stacked ? o.cats.map((_,i)=>sum(S.map(s=>s.data[i]))) : S.flatMap(s=>s.data);
  const max = niceMax(Math.max(...vals,1));
  const pw = W-PL-PR, ph = H-PT-PB;
  const y = v => PT + ph - (v/max)*ph;
  const band = pw/n;

  const svg = sv("svg",{viewBox:`0 0 ${W} ${H}`, height:H, role:"img","aria-label":o.aria||o.title||"長條圖"});

  // gridlines + y ticks
  for(let i=0;i<=3;i++){
    const v = max*i/3, yy = y(v);
    svg.appendChild(sv("line",{x1:PL,x2:W-PR,y1:yy,y2:yy,stroke:i?cssVar("--grid"):cssVar("--axis"),"stroke-width":1}));
    const t = sv("text",{x:PL-7,y:yy+3.5,"text-anchor":"end","font-size":9.5,fill:cssVar("--muted")});
    t.textContent = i? fmtC(v) : "0"; svg.appendChild(t);
  }

  const hit = sv("g",{});
  o.cats.forEach((c,i)=>{
    const bx = PL + band*i;
    if(stacked){
      const bw = Math.min(24, band-10);
      const x = bx + (band-bw)/2;
      let acc = 0;
      S.forEach((s,si)=>{
        const v = s.data[i];
        const y0 = y(acc), y1 = y(acc+v);
        let h = y0-y1;
        const gap = si<S.length-1 ? 2 : 0;
        const topMost = si===S.length-1;
        const d = topMost ? roundTopPath(x,y1,bw,h,4) : `M${x},${y1+ (0)} h${bw} v${h-gap} h${-bw} Z`;
        if(d) svg.appendChild(sv("path",{d, fill:s.color}));
        acc += v;
      });
    } else {
      const bw = Math.min(22, Math.max(5,(band-10)/S.length - 2));
      const gw = bw*S.length + 2*(S.length-1);
      S.forEach((s,si)=>{
        const x = bx + (band-gw)/2 + si*(bw+2);
        const v = s.data[i], y1 = y(v), h = PT+ph-y1;
        const d = roundTopPath(x,y1,bw,h,4);
        if(d) svg.appendChild(sv("path",{d, fill:s.color}));
      });
    }
    // x label（密集時隔一顯示）
    const step = n>9 ? Math.ceil(n/7) : 1;
    if(i%step===0 || i===n-1){
      const t = sv("text",{x:bx+band/2,y:H-7,"text-anchor":"middle","font-size":9.5,fill:cssVar("--muted")});
      t.textContent = c; svg.appendChild(t);
    }
    // hit area
    const r = sv("rect",{x:bx,y:PT,width:band,height:ph,fill:"transparent"});
    r.addEventListener("pointerenter",ev=>{
      const b = r.getBoundingClientRect();
      showTip(b.left+b.width/2, b.top+18, c, S.map(s=>({c:s.color,k:s.name,v:(o.prefix||"")+fmtC(s.data[i])+(o.suffix||"")})));
    });
    r.addEventListener("pointerleave",hideTip);
    hit.appendChild(r);
  });
  svg.appendChild(hit);
  host.appendChild(svg);
}

/* ============================================================
   圖表：直向長條（支援正負值，賺綠虧紅，含零基準線）
   ============================================================ */
function columnChartSigned(host,o){
  host.innerHTML="";
  const W=host.clientWidth||320, H=o.height||190;
  const PL=o.padLeft ?? 46, PR=10, PT=16, PB=24;
  const data=o.series[0].data, n=o.cats.length;
  const hi=Math.max(0,...data), lo=Math.min(0,...data);
  const top=niceMax(hi||1), bot=-niceMax(Math.abs(lo)||1);
  const span=(top-bot)||1;
  const pw=W-PL-PR, ph=H-PT-PB;
  const y=v=>PT+ph*(top-v)/span;
  const band=pw/n;
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,height:H,role:"img","aria-label":o.aria||o.title||"損益長條圖"});

  // y ticks：top / 0 / bot
  [top,0,bot].forEach(v=>{
    const yy=y(v), zero=v===0;
    svg.appendChild(sv("line",{x1:PL,x2:W-PR,y1:yy,y2:yy,stroke:zero?cssVar("--axis"):cssVar("--grid"),"stroke-width":zero?1.2:1}));
    const t=sv("text",{x:PL-7,y:yy+3.5,"text-anchor":"end","font-size":9.5,fill:cssVar("--muted")});
    t.textContent=v===0?"0":fmtC(v); svg.appendChild(t);
  });

  const y0=y(0);
  const hit=sv("g",{});
  o.cats.forEach((c,i)=>{
    const v=data[i], bw=Math.min(22,band-10), x=PL+band*i+(band-bw)/2;
    const yv=y(v), color=v>=0?(o.upColor||cssVar("--s3")):(o.downColor||cssVar("--bad"));
    const yTop=Math.min(yv,y0), h=Math.abs(yv-y0);
    const d=v>=0?roundTopPath(x,yTop,bw,h,4):`M${x},${yTop} h${bw} v${h-4} q0,4 -4,4 h${-(bw-8)} q-4,0 -4,-4 Z`;
    if(h>0.4) svg.appendChild(sv("path",{d,fill:color}));
    const step=n>9?Math.ceil(n/7):1;
    if(i%step===0||i===n-1){
      const t=sv("text",{x:PL+band*i+band/2,y:H-7,"text-anchor":"middle","font-size":9.5,fill:cssVar("--muted")});
      t.textContent=c; svg.appendChild(t);
    }
    const r=sv("rect",{x:PL+band*i,y:PT,width:band,height:ph,fill:"transparent"});
    r.addEventListener("pointerenter",()=>{const b=r.getBoundingClientRect();
      showTip(b.left+b.width/2,b.top+18,c,[{c:color,k:o.series[0].name,v:(o.prefix||"")+fmtC(v)+(o.suffix||"")}]);});
    r.addEventListener("pointerleave",hideTip);
    hit.appendChild(r);
  });
  svg.appendChild(hit);
  host.appendChild(svg);
}

/* ============================================================
   圖表：折線（含區域淡色 + 端點 + 十字準星）
   ============================================================ */
function lineChart(host,o){
  host.innerHTML="";
  const W = host.clientWidth||320, H=o.height||180;
  const PL=o.padLeft ?? 44, PR=14, PT=14, PB=24;
  const S=o.series, n=o.cats.length;
  const max = niceMax(Math.max(...S.flatMap(s=>s.data),1));
  const pw=W-PL-PR, ph=H-PT-PB;
  const X = i => n===1?PL+pw/2:PL + pw*i/(n-1);
  const Y = v => PT+ph-(v/max)*ph;
  const svg = sv("svg",{viewBox:`0 0 ${W} ${H}`,height:H,role:"img","aria-label":o.aria||o.title||"折線圖"});

  for(let i=0;i<=3;i++){
    const v=max*i/3, yy=Y(v);
    svg.appendChild(sv("line",{x1:PL,x2:W-PR,y1:yy,y2:yy,stroke:i?cssVar("--grid"):cssVar("--axis"),"stroke-width":1}));
    const t=sv("text",{x:PL-7,y:yy+3.5,"text-anchor":"end","font-size":9.5,fill:cssVar("--muted")});
    t.textContent = i?fmtC(v):"0"; svg.appendChild(t);
  }
  const cross = sv("line",{x1:0,x2:0,y1:PT,y2:PT+ph,stroke:cssVar("--axis"),"stroke-width":1,opacity:0});
  svg.appendChild(cross);

  S.forEach(s=>{
    const pts = s.data.map((v,i)=>[X(i),Y(v)]);
    if(o.area!==false && S.length===1){
      const d = `M${pts[0][0]},${PT+ph} ` + pts.map(p=>`L${p[0]},${p[1]}`).join(" ") + ` L${pts[n-1][0]},${PT+ph} Z`;
      svg.appendChild(sv("path",{d,fill:s.color,opacity:.10}));
    }
    svg.appendChild(sv("path",{d:"M"+pts.map(p=>p.join(",")).join(" L"),fill:"none",stroke:s.color,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    const last = pts[n-1];
    svg.appendChild(sv("circle",{cx:last[0],cy:last[1],r:5.5,fill:cssVar("--surface-1")}));
    svg.appendChild(sv("circle",{cx:last[0],cy:last[1],r:4,fill:s.color}));
  });

  // 端點直接標值（單一數列）
  if(S.length===1){
    const s=S[0], last=[X(n-1),Y(s.data[n-1])];
    const ly = last[1]-PT < 16 ? last[1]+17 : last[1]-11;
    const t=sv("text",{x:last[0]-2,y:ly,"text-anchor":"end","font-size":10.5,"font-weight":620,fill:cssVar("--text-1")});
    t.textContent=(o.prefix||"")+fmtC(s.data[n-1])+(o.suffix||""); svg.appendChild(t);
  }

  const step = n>9?Math.ceil(n/5):1;
  o.cats.forEach((c,i)=>{
    if(i%step===0||i===n-1){
      const t=sv("text",{x:X(i),y:H-7,"text-anchor":i===0?"start":i===n-1?"end":"middle","font-size":9.5,fill:cssVar("--muted")});
      t.textContent=c; svg.appendChild(t);
    }
  });

  const ov = sv("rect",{x:PL-6,y:PT,width:pw+12,height:ph,fill:"transparent"});
  ov.addEventListener("pointermove",ev=>{
    const b=svg.getBoundingClientRect(), sc=W/b.width;
    const px=(ev.clientX-b.left)*sc;
    let i=Math.round((px-PL)/(pw/(n-1||1))); i=Math.max(0,Math.min(n-1,i));
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.setAttribute("opacity",1);
    showTip(b.left + X(i)/sc, b.top + PT/sc + 10, o.cats[i],
      S.map(s=>({c:s.color,k:s.name,v:(o.prefix||"")+fmtC(s.data[i])+(o.suffix||"")})));
  });
  ov.addEventListener("pointerleave",()=>{cross.setAttribute("opacity",0);hideTip();});
  svg.appendChild(ov);
  host.appendChild(svg);
}

/* ============================================================
   圖表：橫向長條（排行用，值標在尾端）
   ============================================================ */
function hbarChart(host,o){
  host.innerHTML="";
  const W=host.clientWidth||320;
  const items=o.items, rowH=34, H=items.length*rowH+6;
  const max=Math.max(...items.map(d=>d.v),1);
  const valW = o.prefix ? 88 : 64, pw = W-valW;
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,height:H,role:"img","aria-label":o.aria||"排行長條圖"});
  items.forEach((d,i)=>{
    const yTop=i*rowH;
    const t=sv("text",{x:0,y:yTop+12,"font-size":11.5,fill:cssVar("--text-2")});
    t.textContent=d.n; svg.appendChild(t);
    const bh=10, by=yTop+18;
    svg.appendChild(sv("rect",{x:0,y:by,width:pw,height:bh,rx:5,fill:cssVar("--wash")}));
    const w=Math.max(3,pw*d.v/max);
    const p=sv("path",{d:roundRightPath(0,by,w,bh,4),fill:o.color||cssVar("--s1")});
    svg.appendChild(p);
    const vt=sv("text",{x:W,y:by+9,"text-anchor":"end","font-size":11.5,"font-weight":620,fill:cssVar("--text-1")});
    vt.textContent=(o.prefix||"")+fmtC(d.v)+(o.suffix||""); svg.appendChild(vt);
    const hit=sv("rect",{x:0,y:yTop,width:W,height:rowH,fill:"transparent"});
    hit.addEventListener("pointerenter",()=>{
      const b=hit.getBoundingClientRect();
      const rows=[{c:o.color||cssVar("--s1"),k:o.metric||"數值",v:(o.prefix||"")+fmtN(d.v)+(o.suffix||"")}];
      if(d.q!=null) rows.push({k:o.qLabel||"件數",v:fmtN(d.q)+(o.qUnit||"")});
      if(o.share) rows.push({k:"佔比",v:(d.v/sum(items.map(x=>x.v))*100).toFixed(1)+"%"});
      showTip(b.left+b.width/2,b.top+14,d.n,rows);
    });
    hit.addEventListener("pointerleave",hideTip);
    svg.appendChild(hit);
  });
  host.appendChild(svg);
}

const charts = []; // {host, fn, opts} 供 resize 重繪

function chartCard(title, sub, opts, renderer, tableData){
  const card = el("div","card");
  const h = el("h3","",`<span>${title}</span><span class="sp"></span>`);
  const btn = el("button","tablebtn","表格"); btn.setAttribute("aria-pressed","false");
  h.appendChild(btn); card.appendChild(h);
  if(sub) card.appendChild(el("p","sub",sub));
  if(opts.series && opts.series.length>1){
    const lg=el("ul","legend");
    opts.series.forEach(s=>lg.appendChild(el("li","",`<span class="sw ${opts.lineLegend?"line":""}" style="background:${s.color}"></span>${s.name}`)));
    card.appendChild(lg);
  }
  const host = el("div","chart"); card.appendChild(host);
  const tbl = el("div"); tbl.hidden = true; card.appendChild(tbl);
  btn.onclick = ()=>{ const on = tbl.hidden; tbl.hidden=!on; btn.setAttribute("aria-pressed",String(on)); host.hidden=on; if(!on) redraw(); };
  tbl.appendChild(buildTable(tableData));
  charts.push({host, renderer, opts});
  return card;
}
function buildTable(td){
  const t = el("table","dv");
  t.innerHTML = `<thead><tr>${td.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`+
    `<tbody>${td.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>`;
  return t;
}
function tile(lab,val,extra,color,unit){
  const t=el("div","tile");
  t.innerHTML = `<div class="lab">${color?`<span class="dot" style="background:${color}"></span>`:""}${lab}</div>`+
    `<div class="val">${unit?`<small>${unit}</small>`:""}${val}</div>`+
    (extra?`<div class="d">${extra}</div>`:"");
  return t;
}
function redraw(){ charts.forEach(c=>{ if(!c.host.hidden) c.renderer(c.host,c.opts); }); }

function walletCard(w){

  c.innerHTML = `<div class="top"><span class="badge">${w.code}</span>`+
    `<div style="flex:1"><div class="bal">${w.name}．目前餘額</div>`+
    `<div class="balv">${w.cur} ${fmtN(w.balance)}</div>`+

  if(w.rows){
    const row=el("div","wrow");
    w.rows.forEach(r=>{
      const d=el("div");
      d.innerHTML=`<div class="k"><span class="dot" style="width:8px;height:8px;border-radius:99px;display:inline-block;background:${r.c}"></span>${r.k}</div>`+
        `<div class="v">${w.cur} ${fmtC(r.v)}</div>`;
      row.appendChild(d);
    });
    c.appendChild(row);
    const tot=sum(w.rows.map(r=>r.v));
    const mini=el("div","bar-mini");
    w.rows.forEach(r=>{ const i=el("i"); i.style.flex=String(r.v/tot); i.style.background=r.c; mini.appendChild(i); });
    c.appendChild(mini);

  if(w.recent){

    det.innerHTML=`<summary style="cursor:pointer;font-size:12px;color:var(--text-2);list-style:none">近期異動 ▾</summary>`;
    const ul=el("ul","list"); ul.style.marginTop="6px";
    w.recent.forEach(r=>{
      const li=el("li");
      li.innerHTML=`<span class="sm">${r.d}</span><span class="nm">${r.t}</span>`+
        `<span class="pill">${r.k}</span>`+
        `<span class="num" style="color:${r.a>=0?"var(--good)":"var(--text-1)"}">${r.a>=0?"+":"−"}${fmtN(Math.abs(r.a))}</span>`;
      ul.appendChild(li);

    det.appendChild(ul); c.appendChild(det);
  } else if(w.note){
    c.appendChild(el("p","src",w.note)).style.marginTop="10px";
  }
  return c;
}

/* ============================================================
   成本試算器
   ============================================================ */
const CC = { ...DB.costcalc, cost: DB.costcalc.sample.cost, weight: DB.costcalc.sample.weight };

function ccField(label, key, step, unit){
  const wrap=el("div");
  wrap.style.cssText="display:flex;flex-direction:column;gap:5px";
  wrap.innerHTML=`<label style="font-size:11.5px;color:var(--muted)">${label}</label>`;
  const inWrap=el("div"); inWrap.style.cssText="display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface-1);border-radius:10px;padding:8px 10px";
  const inp=el("input");
  inp.type="number"; inp.value=CC[key]; inp.step=step; inp.inputMode="decimal";
  inp.style.cssText="border:0;background:transparent;color:var(--text-1);font:inherit;font-size:16px;font-weight:640;width:100%;outline:none;-moz-appearance:textfield";
  inp.oninput=()=>{ CC[key]=parseFloat(inp.value)||0; renderCostResult(); };
  inWrap.appendChild(inp);
  if(unit){ const u=el("span","",unit); u.style.cssText="font-size:11.5px;color:var(--muted);flex:none"; inWrap.appendChild(u); }
  wrap.appendChild(inWrap);
  return wrap;
}

function costClass(rate){
  for(const c of CC.classes) if(rate>=c.lo && rate<c.hi) return c;
  return rate<CC.classes[0].lo ? {n:"低於引流",c:"var(--bad)"} : CC.classes[CC.classes.length-1];
}

function viewCost(){
  charts.length=0;
  const v=$("#view"); v.innerHTML="";

  // 輸入卡
  const inCard=el("div","card");
  inCard.innerHTML=`<h3>單品成本 · 定價試算</h3><p class="sub">輸入商品成本與參數，自動算出建議售價與各折數利潤</p>`;
  const g1=el("div"); g1.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:12px";
  g1.appendChild(ccField("商品成本","cost",1,"¥"));
  g1.appendChild(ccField("重量","weight",10,"g"));
  g1.appendChild(ccField("匯率 (¥→NT$)","fx",0.01,""));
  g1.appendChild(ccField("國際運費","freightPerKg",5,"NT$/kg"));
  g1.appendChild(ccField("目標利潤率","targetProfit",1,"%"));
  g1.appendChild(ccField("平台+廣告+稅","feeRate",1,"%"));
  inCard.appendChild(g1);
  const hint=el("p","src","平台抽成 25% + 廣告 10% + 稅 8% = 43%（可依實際調整）。運費預設 0，請填入實際國際運費以校準成本。");
  inCard.appendChild(hint);
  v.appendChild(inCard);

  // 結果卡（動態）
  const resCard=el("div","card"); resCard.id="ccRes";
  v.appendChild(resCard);

  const src=el("p","src");
  src.innerHTML=`計價邏輯來源：<a href="https://docs.google.com/spreadsheets/d/1xl7lFPEjLcVTVl-K5I5nS1nABxf4texcKFh0-Sof2tY/edit" target="_blank" rel="noopener">Google 試算表「成本計算」</a>。`;
  v.appendChild(src);

  renderCostResult();

function renderCostResult(){
  const r=$("#ccRes"); if(!r) return;
  const totalCost = CC.cost*CC.fx + (CC.weight/1000)*CC.freightPerKg;         // 商品總成本 NT$
  const space = Math.max(1e-6, 100 - CC.feeRate - CC.targetProfit);            // 剩餘空間 %
  const price = totalCost / (space/100);                                       // 建議定價 NT$
  const profitPct = cur => cur<=0?0:(cur - cur*CC.feeRate/100 - totalCost)/cur*100; // 某實收下的利潤率
  const fullRate = profitPct(price);
  const cls = costClass(fullRate);

  r.innerHTML =
    `<h3>建議售價 <span class="sp"></span></h3>`+
    `<div class="hero" style="padding:6px 0 4px">`+
      `<div class="val" style="font-size:clamp(34px,11vw,44px)"><span class="cur">NT$</span>${fmtN(Math.round(price))}</div>`+
      `<div class="row"><span class="delta up">利潤率 ${fullRate.toFixed(1)}%</span> `+
      `<span class="pill" style="background:${cls.c};color:#fff">${cls.n}</span></div>`+
    `</div>`;

  const t=el("div","tiles t3"); t.style.marginTop="6px";
  t.appendChild(tile("商品總成本",fmtN(Math.round(totalCost)),`¥${fmtN(CC.cost)} × ${CC.fx}${CC.freightPerKg?" + 運費":""}`,"var(--s2)","NT$"));
  t.appendChild(tile("平台+廣告+稅",fmtN(Math.round(price*CC.feeRate/100)),CC.feeRate+"% of 售價","var(--s4)","NT$"));
  t.appendChild(tile("每件淨利",fmtN(Math.round(price - price*CC.feeRate/100 - totalCost)),"原價售出","var(--s3)","NT$"));
  r.appendChild(t);

  // 折數 → 實收 / 利潤率 表
  const discs=[1,0.99,0.98,0.97,0.95,0.93,0.90,0.88,0.85,0.80,0.75];
  const tbl=el("table","dv"); tbl.style.marginTop="14px";
  tbl.innerHTML=`<thead><tr><th>折數</th><th>實收</th><th>平台+廣告+稅</th><th>淨利</th><th>利潤率</th></tr></thead>`+
    `<tbody>${discs.map(d=>{
      const rec=price*d, fee=rec*CC.feeRate/100, net=rec-fee-totalCost, pr=profitPct(rec);
      const cc=costClass(pr);
      return `<tr><td>${d===1?"原價":d.toFixed(2)}</td><td>${fmtN(Math.round(rec))}</td><td>${fmtN(Math.round(fee))}</td>`+
        `<td style="color:${net>=0?'var(--good)':'var(--bad)'}">${fmtN(Math.round(net))}</td>`+
        `<td style="color:${cc.c};font-weight:640">${pr.toFixed(1)}%</td></tr>`;
    }).join("")}</tbody>`;
  r.appendChild(el("p","sub","不同折數下的實收與利潤率")).style.marginTop="14px";
  r.appendChild(tbl);
}

  wc.innerHTML=`<h3>各錢包餘額<span class="sp"></span></h3><p class="sub">目前結餘</p>`;
  const wcolor={twd:"var(--s1)",corp:"var(--s3)",cny:"var(--s4)",cnyLuo:"var(--s2)"};
  const wt=el("div","tiles");
  ["twd","corp","cny","cnyLuo"].forEach(k=>{const w=W[k]; if(w) wt.appendChild(tile(w.name,fmtN(w.balance),"",wcolor[k],w.cur));});
  wc.appendChild(wt);
  v.appendChild(wc);

  // ② 當月損益（可選月份）+ 目前總損益
  const pc=el("div","card");
  pc.innerHTML=`<h3>當月損益<span class="sp"></span></h3>`;
  const chips=el("div","chips");
  cats.forEach(m=>{const b=el("button","",m); b.setAttribute("aria-selected",String(m===homeMonth));
    b.onclick=()=>{homeMonth=m; viewHome();}; chips.appendChild(b);});
  pc.appendChild(chips);
  requestAnimationFrame(()=>{const s=chips.querySelector('[aria-selected="true"]'); if(s) s.scrollIntoView({block:"nearest",inline:"center"});});
  const hb=el("div","hero"); hb.style.padding="4px 0 2px";
  hb.innerHTML=`<div class="lab">${homeMonth}損益${isCur?"（本月至今）":""}</div>`+
    `<div class="val"><span class="cur">NT$</span>${fmtC(cNet)}</div>`+
    `<div class="row">${(hasPrev&&!isCur)?deltaHTML(cNet,pNet,pl):`<span class="n">${isCur?"當月累計，未滿月不與上月比較":"入賬減支出"}</span>`}</div>`;
  pc.appendChild(hb);
  const ov=DB.overall, t3=el("div","tiles t3"); t3.style.marginTop="10px";
  t3.appendChild(tile(`${homeMonth}入賬`,fmtC(cIn),"","var(--s1)","NT$"));
  t3.appendChild(tile(`${homeMonth}支出`,fmtC(cOut),"","var(--s2)","NT$"));
  t3.appendChild(tile("目前總損益",fmtC(ov.pnl),"創立至今累計",ov.pnl>=0?"var(--s3)":"var(--bad)","NT$"));
  pc.appendChild(t3);
  v.appendChild(pc);

  // 損益趨勢（賺綠虧紅）
  v.appendChild(chartCard("損益趨勢",`${f.note}．入賬減支出（賺綠虧紅）`,{
    cats, prefix:"NT$ ", height:150,
    series:[{name:"損益",color:cssVar("--s3"),data:netArr}]
  }, columnChartSigned, {head:[f.unit,"損益"],rows:cats.map((c,i)=>[c,fmtN(netArr[i])])}));

  // ③ 現金續航 runway（可動用新台幣 = 台幣+公司 ÷ 近3月平均月虧）
  const cash=(W.twd?W.twd.balance:0)+(W.corp?W.corp.balance:0);
  // 燒錢速度只採「已完整月份」，排除進行中的當月（未滿月會美化數字）
  const compl=netArr.slice(0,-1), net3=(compl.length?compl:netArr).slice(-3);
  const avgNet=sum(net3)/net3.length, losing=avgNet<0, avgLoss=Math.abs(avgNet);
  const rc=el("div","card");
  rc.innerHTML=`<h3>現金續航（Runway）<span class="sp"></span></h3>`;
  const rb=el("div"); rb.style.cssText="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:2px";
  if(losing){const mo=cash/avgLoss;
    rb.innerHTML=`<div class="val" style="font-size:30px;font-weight:660;line-height:1.1">約 ${mo.toFixed(1)} 個月</div>`+
      `<span class="delta ${mo<6?"down":"up"}">${mo<6?"偏緊":"健康"}</span>`;
  }else{
    rb.innerHTML=`<div class="val" style="font-size:26px;font-weight:660">現金流為正</div><span class="delta up">無壓力</span>`;
  }
  rc.appendChild(rb);
  rc.appendChild(el("p","src",`可動用新台幣 NT$${fmtN(cash)}（台幣+公司錢包）${losing?` ÷ 近3月平均月虧 NT$${fmtN(avgLoss)}`:""}。人民幣錢包另計。`));
  v.appendChild(rc);

  // ④⑤ 直播銷售 + 廣告ROI
  const L=DB.live, lm=L.months.at(-1), M=L.monthly[lm];
  const t=el("div","tiles");
  t.appendChild(tile(`${lm}直播銷售`,fmtC(M.sales),lm===cats.at(-1)?"本月至今":"","var(--s3)","NT$"));
  t.appendChild(tile(`${lm}廣告 ROI`,(M.roi?M.roi+"x":"—"),`花費 NT$${fmtC(M.ad)}`,"var(--s4)"));
  v.appendChild(t);

  v.appendChild(el("p","src","經營快照．點下方分頁看財務、直播、成本細節。"));
  redraw();
}

/* ============================================================
   啟動
   ============================================================ */
let tab="home";
function render(){ ({home:viewHome,fin:viewFinance,data:viewData,cost:viewCost})[tab](); window.scrollTo({top:0}); }
document.querySelectorAll("nav.tabbar button").forEach(b=>{
  b.onclick=()=>{
    tab=b.dataset.tab;
    document.querySelectorAll("nav.tabbar button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
    render();
  };
});
$("#themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur==="dark"?"light":"dark");
  render();
};
$("#updated").textContent = "資料更新於 "+DB.updated+"　·　財務・直播為實際資料";

let rt;
window.addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(redraw,120);});
render();
</script>
</body>
</html>
