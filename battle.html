<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暮若作戰卡</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4a2c3a">
<style>
  :root{
    --plum:#4a2c3a; --plum2:#6b3f52; --rose:#9c5c6e; --gold:#d6a680;
    --cream:#faf6f2; --ink:#372a30; --ink2:#8a7580; --line:#eee2da;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}
  .top{background:linear-gradient(160deg,var(--plum),var(--plum2) 60%,var(--rose));color:#f6eee8;
    padding:calc(env(safe-area-inset-top,0px) + 26px) 20px 22px;border-radius:0 0 24px 24px;text-align:center;}
  .top h1{font-size:22px;font-weight:800;letter-spacing:3px;}
  .top h1 small{font-size:11px;letter-spacing:3px;opacity:.7;margin-left:8px;}
  .top p{font-size:13px;opacity:.85;margin-top:6px;}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 18px rgba(74,44,58,.07);margin-top:14px;}
  .flabel{font-size:13px;font-weight:800;color:var(--plum2);letter-spacing:1px;margin:14px 0 6px;}
  .flabel:first-child{margin-top:0;}
  .hint{font-size:12px;color:var(--ink2);margin:-2px 0 6px;line-height:1.6;}
  input[type=date]{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;background:#fff;color:var(--ink);}
  .optrow{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);}
  .opt.on{border-color:var(--plum2);background:var(--plum2);color:#fff;}
  input:focus,textarea:focus{outline:2px solid var(--rose);border-color:var(--rose);}

  /* 排品 · 知識卡 */
  .plsec{margin-top:6px;}
  .plcard{background:#fffdfb;border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-top:10px;}
  .pl-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .pl-no{font-size:12px;font-weight:800;color:#b0813f;background:#faeeda;border-radius:99px;padding:3px 12px;letter-spacing:1px;}
  .pl-del{border:none;background:none;color:var(--ink2);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px 4px;}
  .pl-field{margin-top:7px;}
  .pl-field>label,.pl-group>label{font-size:12px;font-weight:800;color:var(--plum2);display:block;margin-bottom:4px;letter-spacing:.5px;}
  .pl-field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-size:14.5px;font-family:inherit;background:#fff;color:var(--ink);}
  .pl-group{margin-top:9px;}
  .pl-lines{display:flex;flex-direction:column;gap:6px;}
  .pl-line{display:flex;gap:6px;align-items:flex-start;}
  .pl-input{flex:1 1 auto;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-size:14.5px;font-family:inherit;background:#fff;color:var(--ink);}
  textarea.pl-input{resize:vertical;min-height:46px;line-height:1.6;}
  .pl-x{flex:0 0 auto;width:32px;height:36px;border:1.5px solid var(--line);background:#fff;border-radius:9px;color:var(--ink2);font-size:17px;line-height:1;cursor:pointer;}
  .pl-x:active{background:#f7edf1;}
  .pl-addline{border:none;background:none;color:var(--rose);font-size:13px;font-weight:800;cursor:pointer;padding:6px 2px;margin-top:3px;letter-spacing:.5px;}
  .pl-add{width:100%;border:1.5px dashed var(--rose);background:none;color:var(--plum2);border-radius:12px;padding:12px;font-size:14px;font-weight:800;letter-spacing:1px;cursor:pointer;margin-top:12px;}
  .pl-add:active{background:#fdf4f7;}

  .savebtn{width:100%;border:none;border-radius:14px;background:var(--plum2);color:#fff;
    font-size:18px;font-weight:800;letter-spacing:3px;padding:15px 0;margin-top:16px;cursor:pointer;}
  .savebtn:disabled{opacity:.5;}
  #msg{margin-top:10px;font-size:14px;font-weight:700;text-align:center;border-radius:10px;padding:10px;display:none;}
  #msg.good{display:block;background:#E6F4EC;color:#146C48;}
  #msg.warn{display:block;background:#FCF3D7;color:#8a6a10;}
  #msg.bad{display:block;background:#FBE4E4;color:#A4344F;}
  .hist h2{font-size:15px;color:var(--plum2);letter-spacing:1px;margin-bottom:8px;}
  .hrow{padding:10px 4px;border-top:1px dashed var(--line);font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:baseline;}
  .hrow:first-of-type{border-top:none;}
  .hdate{font-weight:800;color:var(--plum2);white-space:nowrap;}
  .hslot{font-size:12px;background:#F4EAF0;color:#7a4b62;border-radius:6px;padding:1px 8px;white-space:nowrap;}
  .hsum{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty{color:var(--ink2);font-size:13px;}
  footer{text-align:center;margin-top:22px;font-size:12px;color:#b9a8b0;}
  footer a{color:var(--rose);}
</style>
</head>
<body>

<div class="top">
  <h1>本週作戰卡<small>MURO</small></h1>
  <p>選本週哪一天・早班或晚班・排好品先讀熟知識卡</p>
</div>

<div class="wrap">
  <div class="card">
    <div class="flabel">📅 選週期</div>
    <div class="optrow" id="dayRow"></div>
    <input type="hidden" id="fdate">
    <div class="flabel">🕒 場次</div>
    <div class="optrow" id="slotRow"></div>

    <div class="flabel">🎬 這場排品 · 知識卡</div>
    <div class="hint">一段一個主題，底下的商品、贈品、知識點都可以按「＋」加好幾個。主播開播前先讀熟知識點。</div>
    <div class="plsec" id="plWrap"></div>
    <button type="button" class="pl-add" id="plAdd">＋ 加一個主題</button>

    <button class="savebtn" id="save">儲存作戰卡</button>
    <div id="msg"></div>
  </div>

  <div class="card hist">
    <h2>🗂 歷史場次（點一下載入）</h2>
    <div id="hlist" class="empty">載入中…</div>
  </div>

  <footer><a href="team.html">← 回團隊首頁</a></footer>
</div>

<script>
var SHEET_ID='1SsIRULQjX5dQJgnEzfijQuZV5lfJKHmwHy2CJvG_XwE';
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbxujluuIzHbqtxJJtssliT1bOiU8Q8J0NWhAbYJzGTueqUWaEKFhzraBMapcGLBq95QMg/exec';
var TOKEN='muro2026';
var CSV='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent('作戰卡');

var SLOTS=['早班','晚班'];
var slot='早班';
var cards={}; // 'date|slot' -> {..}

function pad(n){return (n<10?'0':'')+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var WD=['一','二','三','四','五','六','日'];
function mondayOf(d){var x=new Date(d);var g=x.getDay();x.setDate(x.getDate()-((g+6)%7));return x;}
function fmtMD(d){return pad(d.getMonth()+1)+'/'+pad(d.getDate());}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function weekRange(mon){var s=new Date(mon);s.setDate(mon.getDate()+6);return fmtMD(mon)+'–'+fmtMD(s);}
function rangeFromStr(ds){var p=(ds||'').split('-');if(p.length<3)return ds||'';return weekRange(new Date(+p[0],+p[1]-1,+p[2]));}
function selWeek(ds){var r=document.getElementById('dayRow');[].forEach.call(r.children,function(x){x.classList.toggle('on',x.getAttribute('data-d')===ds);});document.getElementById('fdate').value=ds;}
function buildWeeks(){
  var r=document.getElementById('dayRow');r.innerHTML='';var tm=mondayOf(new Date());
  [{o:-1,l:'上週'},{o:0,l:'本週'},{o:1,l:'下週'},{o:2,l:'下下週'}].forEach(function(w){
    var m=new Date(tm);m.setDate(tm.getDate()+w.o*7);var ds=dstr(m);
    var b=document.createElement('button');b.className='opt';b.setAttribute('data-d',ds);
    b.textContent=w.l+' '+weekRange(m);
    b.onclick=function(){selWeek(this.getAttribute('data-d'));fill();};
    r.appendChild(b);});
  selWeek(dstr(tm));
}

/* ---------- 排品 · 知識卡（主題 + 複數 商品/贈品/知識點）---------- */
var CN=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
var PH={goods:'品名 / 貨號', gifts:'贈品，沒有就不用加', knows:'主播先讀熟：材質怎麼說、解決什麼痛點、怎麼搭、跟市面差在哪'};

function plLine(kind,val){
  var row=document.createElement('div');row.className='pl-line';
  var el=(kind==='knows')?document.createElement('textarea'):document.createElement('input');
  el.className='pl-input';el.value=val||'';el.placeholder=PH[kind]||'';
  if(kind==='knows')el.rows=2;
  var x=document.createElement('button');x.type='button';x.className='pl-x';x.textContent='×';
  x.onclick=function(){row.parentNode.removeChild(row);};
  row.appendChild(el);row.appendChild(x);
  return row;
}
function plCard(){
  var d=document.createElement('div');d.className='plcard';
  d.innerHTML=
    '<div class="pl-top"><span class="pl-no"></span><button class="pl-del" type="button">刪除整段</button></div>'+
    '<div class="pl-field"><label>主題</label><input class="pl-theme" placeholder="這一段的切入主題，例：換季保暖 / 一件抵三件"></div>'+
    '<div class="pl-group" data-k="goods"><label>商品</label><div class="pl-lines"></div><button class="pl-addline" type="button">＋ 加商品</button></div>'+
    '<div class="pl-group" data-k="gifts"><label>贈品</label><div class="pl-lines"></div><button class="pl-addline" type="button">＋ 加贈品</button></div>'+
    '<div class="pl-group" data-k="knows"><label>知識點</label><div class="pl-lines"></div><button class="pl-addline" type="button">＋ 加知識點</button></div>';
  d.querySelector('.pl-del').onclick=function(){d.parentNode.removeChild(d);renumber();};
  [].forEach.call(d.querySelectorAll('.pl-group'),function(g){
    var k=g.getAttribute('data-k');
    g.querySelector('.pl-addline').onclick=function(){g.querySelector('.pl-lines').appendChild(plLine(k,''));};
  });
  return d;
}
function fillGroup(card,k,vals){
  var box=card.querySelector('.pl-group[data-k="'+k+'"] .pl-lines');
  if(!vals||!vals.length){ if(k!=='gifts') box.appendChild(plLine(k,'')); return; }
  vals.forEach(function(v){box.appendChild(plLine(k,v));});
}
function addBlock(data){
  data=data||{};
  var goods=data.goods,gifts=data.gifts,knows=data.knows;
  if(!goods && data.name!==undefined){ // 相容舊格式 {theme,name,gift,know}
    goods=data.name?[data.name]:[]; gifts=data.gift?[data.gift]:[]; knows=data.know?[data.know]:[];
  }
  var card=plCard();
  card.querySelector('.pl-theme').value=data.theme||'';
  fillGroup(card,'goods',goods);
  fillGroup(card,'gifts',gifts);
  fillGroup(card,'knows',knows);
  document.getElementById('plWrap').appendChild(card);renumber();
}
function renumber(){
  var cs=document.getElementById('plWrap').children;
  [].forEach.call(cs,function(c,i){c.querySelector('.pl-no').textContent='主題 '+(CN[i]||(i+1));});
}
function readLineup(){
  var arr=[];
  [].forEach.call(document.getElementById('plWrap').children,function(card){
    var o={theme:card.querySelector('.pl-theme').value.trim(),goods:[],gifts:[],knows:[]};
    [].forEach.call(card.querySelectorAll('.pl-group'),function(g){
      var k=g.getAttribute('data-k');
      [].forEach.call(g.querySelectorAll('.pl-input'),function(inp){var v=inp.value.trim();if(v)o[k].push(v);});
    });
    if(o.theme||o.goods.length||o.gifts.length||o.knows.length)arr.push(o);
  });
  return arr;
}
function setLineup(focus){
  var wrap=document.getElementById('plWrap');wrap.innerHTML='';
  var arr=null;
  try{var p=JSON.parse(focus);if(Array.isArray(p))arr=p;}catch(e){}
  if(arr&&arr.length){arr.forEach(function(x){addBlock(x);});}
  else if(focus&&focus.trim()){addBlock({knows:[focus.trim()]});}
  else{addBlock({});}
  renumber();
}
function sumOf(focus){
  try{var a=JSON.parse(focus);if(Array.isArray(a)&&a.length){
    var b=a[0];return b.theme || (b.goods&&b.goods[0]) || '（未填排品）';
  }}catch(e){}
  return (focus&&focus.trim())?'（排品）':'（未填排品）';
}

function buildSlots(){
  var r=document.getElementById('slotRow');r.innerHTML='';
  SLOTS.forEach(function(s){
    var b=document.createElement('button');b.className='opt'+(s===slot?' on':'');b.textContent=s;
    b.onclick=function(){slot=s;[].forEach.call(r.children,function(x){x.classList.remove('on');});b.classList.add('on');fill();};
    r.appendChild(b);
  });
}
function parseCSV(text){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'||c==='\r'){if(cur!==''||row.length){row.push(cur);rows.push(row);row=[];cur='';}}
      else cur+=c;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function normDate(s){s=(s||'').trim();var m=s.match(/(\d{4})[\/\-年\.](\d{1,2})[\/\-月\.](\d{1,2})/);
  return m?m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]):null;}

function load(){
  fetch(CSV+'&t='+Math.floor(Math.random()*1e9)).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){
    var rows=parseCSV(t);cards={};
    if(rows.length&&(rows[0][0]||'').indexOf('日期')===-1){renderHist();return;}
    for(var i=1;i<rows.length;i++){
      var d=normDate(rows[i][0]);if(!d)continue;
      cards[d+'|'+(rows[i][1]||'').trim()]={
        date:d,slot:(rows[i][1]||'').trim(),focus:rows[i][3]||''};
    }
    renderHist();fill();
  }).catch(function(){renderHist();});
}
function fill(){
  var c=cards[document.getElementById('fdate').value+'|'+slot]||{};
  setLineup(c.focus||'');
}
function renderHist(){
  var el=document.getElementById('hlist');
  var keys=Object.keys(cards).sort().reverse().slice(0,12);
  if(!keys.length){el.className='empty';el.textContent='還沒有作戰卡，填好上面第一張按儲存就有了。';return;}
  el.className='';el.innerHTML='';
  keys.forEach(function(k){
    var c=cards[k];
    var row=document.createElement('div');row.className='hrow';
    row.innerHTML='<span class="hdate">'+rangeFromStr(c.date)+'</span>'+
      '<span class="hslot">'+(c.slot||'—')+'</span>'+
      '<span class="hsum">'+sumOf(c.focus)+'</span>';
    row.onclick=function(){
      selWeek(c.date);
      slot=c.slot||'早班';buildSlots();fill();
      window.scrollTo({top:0,behavior:'smooth'});
    };
    el.appendChild(row);
  });
}
function showMsg(cls,t){var m=document.getElementById('msg');m.className=cls;m.textContent=t;}

document.getElementById('plAdd').onclick=function(){addBlock({});};

document.getElementById('save').onclick=function(){
  var date=document.getElementById('fdate').value;
  if(!date){showMsg('warn','先選日期');return;}
  var payload={token:TOKEN,action:'card_save',date:date,slot:slot,
    strategy:'', focus:JSON.stringify(readLineup()), hook:'', notes:'', r1:'', r2:'', r3:''};
  var btn=document.getElementById('save');btn.disabled=true;
  showMsg('warn','儲存中…');
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)})
  .then(function(r){return r.text();})
  .then(function(t){
    if(t==='ok'||t==='updated'){
      showMsg('good','✅ 已儲存　'+rangeFromStr(date)+'（'+slot+'）');
      cards[date+'|'+slot]=payload;renderHist();
    }else{showMsg('bad','儲存失敗，請確認寫入服務已更新到最新版');}
  })
  .catch(function(){showMsg('bad','連不上寫入服務，請確認網路後再試');})
  .finally(function(){btn.disabled=false;});
};

buildWeeks();
buildSlots();
fill();
load();
</script>
</body>
</html>
