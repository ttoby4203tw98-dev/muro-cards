<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>財務總覽｜暮若</title>
<meta name="theme-color" content="#4a2c3a">
<meta name="robots" content="noindex">
<style>
  :root{--plum:#4a2c3a;--plum2:#6b3f52;--rose:#9c5c6e;--gold:#d6a680;--cream:#faf6f2;--card:#fff;--ink:#372a30;--ink2:#8a7580;--line:#eee2da;--neg:#b3261e;--pos:#1e7a46}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  header{background:linear-gradient(160deg,var(--plum),var(--plum2) 55%,var(--rose));color:#f6eee8;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 26px;border-radius:0 0 24px 24px}
  header a{color:#f6eee8;text-decoration:none;font-size:14px;opacity:.8}
  header h1{font-size:24px;letter-spacing:1px;margin-top:8px}
  header p{font-size:12px;opacity:.75;margin-top:4px}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px;box-shadow:0 6px 18px rgba(74,44,58,.06)}
  .box h2{font-size:16px;color:var(--plum);margin-bottom:10px;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th{background:var(--plum);color:#fff;font-weight:600;padding:8px 6px;font-size:13px}
  td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
  td:first-child,th:first-child{text-align:left}
  tr.sum td{font-weight:700;background:#f6eef0}
  .neg{color:var(--neg)} .pos{color:var(--pos)}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{background:#f8f2ef;border-radius:14px;padding:12px}
  .tile small{display:block;font-size:12px;color:var(--ink2)}
  .tile b{display:block;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
  .tile.all{grid-column:1/-1;background:#efe6ea}
  .struct{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .struct svg{flex:0 0 190px;max-width:190px}
  .struct table{flex:1 1 260px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  details{border-bottom:1px solid var(--line)}
  details summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 4px;cursor:pointer;font-weight:600;font-size:14px}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"›";display:inline-block;margin-right:8px;color:var(--ink2);transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  details summary .l{flex:1}
  details summary .p{color:var(--ink2);font-weight:400;font-size:12px;margin-left:8px;min-width:46px;text-align:right}
  details table{margin:0 0 10px}
  details td{font-size:13px;color:#4c3d44}
  .muted{color:var(--ink2);font-size:12px;margin-top:8px;line-height:1.6}
  #gate{max-width:360px;margin:60px auto;padding:0 16px}
  #gate input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:12px}
  #gate button{width:100%;margin-top:12px;font-size:16px;padding:12px;border:0;border-radius:12px;background:var(--plum);color:#fff;font-weight:600}
  #gate label{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink2)}
  #gate label input{width:auto;margin:0}
  #err{color:var(--neg);font-size:13px;margin-top:10px;min-height:18px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;font-size:14px;color:var(--ink)}
  .seg button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
  .seg input,.seg select{margin-left:auto;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi div{background:#f8f2ef;border-radius:14px;padding:12px 8px;text-align:center}
  .kpi small{display:block;font-size:12px;color:var(--ink2)}
  .kpi b{display:block;font-size:19px;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .pl{background:#efe6ea}
  .kpi div small:last-child:not(:first-child){display:block;margin-top:2px}
  .bbar{height:8px;border-radius:99px;background:#eee2da;margin:10px 0 0;overflow:hidden}.bbar i{display:block;height:100%;background:var(--pos)}.bbar i.over{background:var(--neg)}
  #budget th.r,#budget td{text-align:right}#budget td:first-child{text-align:left}
  .top button{background:none;border:1px solid rgba(255,255,255,.4);color:#f6eee8;border-radius:99px;padding:4px 12px;font-size:12px}
</style>
</head>
<body>
<header><div class="wrap" style="padding-bottom:0">
  <div class="top"><a href="team.html">‹ 團隊首頁</a><button id="logout" hidden>登出</button></div>
  <h1>財務總覽</h1><p id="sub">2026/1 ~ 2026/9・資料即時讀自財會表</p>
</div></header>

<div id="gate">
  <div class="box"><h2>🔒 請輸入財務密碼</h2>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="密碼">
    <label><input id="remember" type="checkbox" checked> 記住這台裝置</label>
    <button id="go">進入</button><div id="err"></div>
  </div>
</div>
<div class="wrap" id="main" hidden></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzLo_qUekF345A28WAiQbC1BhxiBA7ufsbw63XczTjXlZv2972bQ4NGmtYPOfnPHZE/exec"; // 財會表 Apps Script 網頁應用程式網址（部署後填入）
const KEY = "muro_fin_pw", DKEY = "muro_fin_data"; // 記住裝置時，也存上次的資料讓頁面秒開
const $ = (s) => document.querySelector(s);
const fmt = (n) => (typeof n === "number" ? Math.round(n).toLocaleString("zh-TW") : n === "" || n == null ? "" : String(n));
const cls = (n) => (typeof n === "number" && n < 0 ? "neg" : typeof n === "number" && n > 0 ? "pos" : "");
const pct = (n) => (typeof n === "number" ? (n * 100).toFixed(1) + "%" : "");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COLORS = ["#4a2c3a", "#9c5c6e", "#d6a680", "#6b8fa3", "#7a9e7e", "#c98b6b", "#8e7cc3", "#b8a99a", "#5f8a8b", "#d4b35f"];
const get = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const set = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

async function call(body) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  return r.json();
}
async function enter(pw, remember, fresh) {
  $("#err").textContent = "讀取中…"; setSync("更新中…");
  try {
    let d = await call({ action: "overview", pw, fresh: !!fresh });
    if (d.ok && !valid(d)) d = await call({ action: "overview", pw, fresh: true }); // 偶爾回到非財務資料 → 重抓一次
    if (d.ok && !valid(d)) throw new Error("財會表回應格式不對，請按重新整理");
    if (!d.ok) { if (/密碼|設定/.test(d.err || "")) { set(KEY, null); set(DKEY, null); showGate(); } $("#err").textContent = d.err || "讀取失敗"; setSync(""); return; }
    if (remember) { set(KEY, pw); set(DKEY, JSON.stringify(d)); }
    render(d); setSync("");
  } catch (e) { $("#err").textContent = "連不到財會表：" + e.message;
    if ($("#sync")) setSync("連不到財會表，顯示的是上次的資料"); else if (!$("#main").hidden) $("#main").innerHTML = `<div class="box"><p class="muted" style="text-align:center">連不到財會表，請稍後重新整理。</p></div>`; }
}
const valid = (d) => !!(d && d.ok && d.wallet && Array.isArray(d.struct) && Array.isArray(d.detail) && Array.isArray(d.offbook));
function showGate() { $("#gate").hidden = false; $("#main").hidden = true; $("#logout").hidden = true; }
function setSync(t) { const el = $("#sync"); if (el) el.textContent = t; }
function pie(items, center) { // items: [{name, v}] 正數；center = 中間顯示的數字（預設加總）
  const tot = items.reduce((s, x) => s + x.v, 0) || 1; let a = -Math.PI / 2, out = "";
  items.forEach((x, i) => {
    if (x.v / tot > 0.9999) { // 只有一類：SVG 弧線起點＝終點畫不出來，改畫整圈
      out += `<circle cx="100" cy="100" r="71" fill="none" stroke="${COLORS[i % COLORS.length]}" stroke-width="38"><title>${esc(x.name)} 100%</title></circle>`; return; }
    const f = x.v / tot, a2 = a + f * Math.PI * 2, large = f > 0.5 ? 1 : 0, R = 90, r = 52;
    const p = (ang, rad) => [100 + rad * Math.cos(ang), 100 + rad * Math.sin(ang)].map((n) => n.toFixed(2)).join(" ");
    out += `<path d="M ${p(a, R)} A ${R} ${R} 0 ${large} 1 ${p(a2, R)} L ${p(a2, r)} A ${r} ${r} 0 ${large} 0 ${p(a, r)} Z" fill="${COLORS[i % COLORS.length]}"><title>${esc(x.name)} ${(f * 100).toFixed(1)}%</title></path>`;
    a = a2;
  });
  return `<svg viewBox="0 0 200 200" role="img" aria-label="支出結構圓餅圖">${out}<text x="100" y="96" text-anchor="middle" font-size="12" fill="#8a7580">總支出</text><text x="100" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#372a30">${fmt(center ?? tot)}</text></svg>`;
}
function render(d) {
  $("#gate").hidden = true; $("#main").hidden = false; $("#logout").hidden = false;
  if (d.title) $("#sub").textContent = String(d.title).replace(/^財務總覽2｜/, "") + "・資料即時讀自財會表";
  const w = d.wallet.val, fx = (x, cur) => (typeof x === "number" ? (x < 0 ? "-" : "") + cur + Math.abs(Math.round(x)).toLocaleString("zh-TW") : x);
  const st = d.struct.filter((r) => r[0] && r[0] !== "合計"), stSum = d.struct.find((r) => r[0] === "合計") || [];
  // 支出明細：依大類分組（大類列 A 有字、科目列 A 空白 B 有字）
  const groups = []; d.detail.forEach((r) => { if (!r[0] && !r[1]) return; if (r[0] && r[0] !== "支出合計") groups.push({ r, subs: [] }); else if (!r[0] && groups.length) groups[groups.length - 1].subs.push(r); });
  const detTotal = d.detail.find((r) => r[0] === "支出合計");
  const grpHtml = (g, withPct) => `<details><summary><span class="l">${esc(g.r[0])}</span><span class="${cls(g.r[2])}">${fmt(g.r[2])}</span>${withPct ? `<span class="p">${pct(g.r[3])}</span>` : ""}</summary><table>${g.subs.filter((s) => !(String(s[1]).startsWith("其他") && Math.round(s[2]) === 0)).map((s) => `<tr><td>${esc(s[1])}</td><td class="${cls(s[2])}">${fmt(s[2])}</td>${withPct ? `<td>${pct(s[3])}</td>` : ""}</tr>`).join("")}</table></details>`;
  const off = []; d.offbook.forEach((r) => { if (!r[0] && !r[1]) return; if (r[0]) off.push({ r, subs: [] }); else if (off.length) off[off.length - 1].subs.push(r); });
  $("#main").innerHTML = `
  <div class="box"><h2>① 收支總覽</h2><div id="period"></div></div>
  <div class="box"><h2>② 錢包餘額（最新）</h2><div class="tiles">
    <div class="tile"><small>人民幣錢包</small><b class="${cls(w[0])}">${fx(w[0], "¥")}</b></div>
    <div class="tile"><small>台幣錢包</small><b class="${cls(w[1])}">${fx(w[1], "NT$")}</b></div>
    <div class="tile"><small>公司錢包</small><b class="${cls(w[2])}">${fx(w[2], "NT$")}</b></div>
    <div class="tile all"><small>合計（台幣，人民幣×匯率）</small><b class="${cls(w[3])}">${fx(w[3], "NT$")}</b></div></div></div>
  <div class="box" id="budget" hidden></div>
  <div class="box" id="expStruct"><h2>③ 支出結構（累計）</h2><div class="struct">${pie(st.map((r) => ({ name: r[0], v: Math.abs(r[1]) })))}
    <table><tbody>${st.map((r, i) => `<tr><td><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>${esc(r[0])}</td><td class="neg">${fmt(r[1])}</td><td>${pct(r[2])}</td></tr>`).join("")}
    <tr class="sum"><td>合計</td><td class="neg">${fmt(stSum[1])}</td><td>${pct(stSum[2])}</td></tr></tbody></table></div></div>
  <div class="box" id="expDetail"><h2>④ 支出明細（點大類展開）</h2>${groups.map((g) => grpHtml(g, true)).join("")}
    <table><tr class="sum"><td>支出合計</td><td class="neg">${detTotal ? fmt(detTotal[2]) : ""}</td><td>${detTotal ? pct(detTotal[3]) : ""}</td></tr></table></div>
  <div class="box"><h2>⑤ 有記帳但不算進損益</h2>${off.map((g) => grpHtml(g, false)).join("")}
    <p class="muted">充值、內部轉帳、已從蝦皮實收扣過的退款不重複計算（囤貨已改成付款當月算支出，在上面 ③④）。</p></div>
  <p class="muted" style="text-align:center">更新時間 ${new Date(d.at).toLocaleString("zh-TW")}　<span id="sync"></span>　<a href="#" id="refresh" style="color:var(--rose)">重新整理</a></p>`;
  $("#refresh").onclick = (e) => { e.preventDefault(); const pw = get(KEY); if (pw) enter(pw, true, true); else showGate(); };
  renderPeriod(d);
}
// ---- 收支總覽：日／月／年，只顯示選到的那一期
const P = { mode: "月", day: "", month: "", year: "" };
function renderPeriod(d) {
  const box = $("#period");
  if (!d.months || !d.days) { box.innerHTML = `<p class="muted">財會表 API 還是舊版，請到 Apps Script「管理部署作業」更新成新版本。</p>`; return; }
  const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const days = d.days.filter((r) => r[0] <= today), hasDay = days.filter((r) => r[1] || r[2]);
  const months = d.months.map((r, i) => ({ ym: `2026-${String(i + 1).padStart(2, "0")}`, inc: r[1], exp: r[2], pl: r[3] })).filter((m) => m.inc || m.exp || m.ym === today.slice(0, 7)); // 當月一定列出（月初還沒數字也能看樣品預算）
  if (!P.month) P.month = months.some((m) => m.ym === today.slice(0, 7)) ? today.slice(0, 7) : (months[months.length - 1] || {}).ym || today.slice(0, 7);
  if (!P.day) { const y = new Date(Date.now() + 8 * 3600e3 - 864e5).toISOString().slice(0, 10); P.day = (hasDay.filter((r) => r[0] <= y).pop() || hasDay[hasDay.length - 1] || [y])[0]; }
  if (!P.year) P.year = "2026";
  let inc = 0, exp = 0, pl = 0, label = "", note = "";
  if (P.mode === "日") { const r = d.days.find((x) => x[0] === P.day) || [P.day, 0, 0, 0]; [inc, exp, pl] = [r[1], r[2], r[3]]; label = P.day.replace(/-/g, "/");
    note = "日收入 = 當天訂單的蝦皮實收，要等撥款（約 1～38 天）才會出現，所以最近幾天的收入偏低或是 0，之後會陸續補上。日支出 = 當天出貨的商品成本（推估）＋ 當天付款的費用；薪水、房租依實際付款日，發薪那天支出會特別大。"; }
  if (P.mode === "月") { const m = months.find((x) => x.ym === P.month) || { inc: 0, exp: 0, pl: 0 }; [inc, exp, pl] = [m.inc, m.exp, m.pl]; label = P.month.replace("-", "/");
    note = "月支出依歸屬月（例如 9 月薪水 10 月發，仍算 9 月）。收入 = 蝦皮實收，當月訂單撥款要到下個月才完整。"; }
  if (P.mode === "年") { months.filter((m) => m.ym.startsWith(P.year)).forEach((m) => { inc += m.inc; exp += m.exp; pl += m.pl; }); label = `${P.year} 年（1 月至 ${months.length ? +months[months.length - 1].ym.slice(5) : 0} 月）`;
    note = "年 = 各月加總。"; }
  const picker = P.mode === "日" ? `<input type="date" id="pp" value="${P.day}" min="2026-01-01" max="${today}">`
    : P.mode === "月" ? `<select id="pp">${months.map((m) => `<option value="${m.ym}" ${m.ym === P.month ? "selected" : ""}>${m.ym.replace("-", "/")}</option>`).join("")}</select>`
    : `<select id="pp"><option value="2026">2026</option></select>`;
  const rate = inc && P.mode !== "日" ? ` <span style="font-size:12px;color:var(--ink2)">淨利率 ${(pl / inc * 100).toFixed(1)}%</span>` : "";
  box.innerHTML = `<div class="seg">${["日", "月", "年"].map((k) => `<button data-m="${k}" class="${P.mode === k ? "on" : ""}">${k}</button>`).join("")}${picker}</div>
    <div style="font-size:14px;font-weight:600;margin-bottom:8px">${esc(label)}${rate}</div>
    <div class="kpi"><div><small>收入</small><b class="${cls(inc)}">${fmt(inc)}</b></div><div><small>支出</small><b class="${cls(exp)}">${fmt(exp)}</b></div><div class="pl"><small>損益</small><b class="${cls(pl)}">${fmt(pl)}</b></div></div>
    <p class="muted">${note}</p>`;
  renderExp(d); renderBudget(d);
  box.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { P.mode = b.dataset.m; renderPeriod(d); }));
  $("#pp").onchange = (e) => { const v = e.target.value; if (!v) return; if (P.mode === "日") P.day = v; else if (P.mode === "月") P.month = v; else P.year = v; renderPeriod(d); };
}
// ---- 樣品預算：當月預算 = 前兩個月總銷售額(下單)加總 × 1%，沒用完累積（最多 2 倍）；已花 = 帳上樣品支出 − 1688 退款（依歸屬月）
//   月／日 → 顯示該月；年 → 列出該年每個月
function renderBudget(d) {
  const box = $("#budget"), B = d.budget; if (!B || !B.months) { box.hidden = true; return; }
  const ms = B.months, fx = B.fx || 0, nt = (x) => "NT$" + fmt(x), rmb = (x) => (fx ? `≈¥${fmt(x / fx)}` : "");
  const ym = (P.mode === "日" ? P.day : P.month).slice(0, 7).replace("-", "/");
  let html;
  if (P.mode === "年") {
    const ks = Object.keys(ms).filter((k) => k.startsWith(P.year)).sort();
    html = ks.length ? `<table><tr><th>月份</th><th class="r">預算</th><th class="r">樣品支出</th><th class="r">退款</th><th class="r">已花</th><th class="r">剩餘</th></tr>${ks.map((k) => { const b = ms[k];
      return `<tr><td>${k}${b.est ? " <small>暫估</small>" : ""}</td><td>${nt(b.avail)}</td><td>${nt(b.spent)}</td><td class="pos">${nt(Math.abs(b.refund))}</td><td>${nt(b.used)}</td><td class="${b.remain < 0 ? "neg" : "pos"}">${nt(b.remain)}</td></tr>`; }).join("")}</table>`
      : `<p class="muted">${P.year} 年還沒有樣品預算（從 2026/10 起算）。</p>`;
  } else {
    const b = ms[ym];
    if (!b) html = `<p class="muted">${ym} 沒有樣品預算（從 2026/10 起算）。</p>`;
    else { const pct = b.avail ? Math.round(b.used / b.avail * 100) : 0;
      html = `<div class="kpi"><div><small>可用預算</small><b>${nt(b.avail)}</b><small>${rmb(b.avail)}</small></div><div><small>已花</small><b>${nt(b.used)}</b><small>${pct}%</small></div><div class="pl"><small>${b.remain < 0 ? "已超過" : "剩餘"}</small><b class="${b.remain < 0 ? "neg" : "pos"}">${nt(Math.abs(b.remain))}</b><small>${rmb(Math.abs(b.remain))}</small></div></div>
      <div class="bbar"><i class="${b.remain < 0 ? "over" : ""}" style="width:${Math.min(100, pct)}%"></i></div>
      <p class="muted">預算 = ${b.sales[0]}＋${b.sales[1]} 下單總額 × 1% = ${nt(b.base)}${b.carry ? `，加上月累積 ${nt(b.carry)}` : ""}（最多累積到 2 倍）。已花 = 樣品支出 ${nt(b.spent)} − 1688 退款 ${nt(Math.abs(b.refund))}（錢包記帳，依歸屬月）。${b.est ? `<br>${b.sales[1]} 還沒結束，預算是暫估。` : ""}</p>`; }
  }
  box.hidden = false;
  box.innerHTML = `<h2>樣品預算（${P.mode === "年" ? P.year + " 年" : ym}）</h2>${html}`;
}
// ---- ③④ 支出結構／明細：跟著上面的 日／月／年
//   月 = 該月；年 = 各月加總；日 = 該天所在月份 ÷ 天數（本月用今天是第幾天）
const SUBNAME = { 出貨訂單: "出貨訂單（客人訂單進貨，實際付款）", 囤貨: "囤貨（先買來放庫存）", 退款: "1688 退款（退回的錢，減少支出）" };
// 薪資和獎金已拆開：人事底下的「薪資獎金」叫薪資、獎金底下的叫獎金
const SUBNAME_BY = { 人事: { 薪資獎金: "薪資" }, 獎金: { 薪資獎金: "獎金", 人事: "獎金（記在人事科目）" } };
const subName = (cat, k) => (SUBNAME_BY[cat] || {})[k] || SUBNAME[k] || k;
function renderExp(d) {
  if (!d.exp) return; // 舊版 API：維持累計
  const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  let yms = [], div = 1, label = "";
  if (P.mode === "月") { yms = [P.month]; label = P.month.replace("-", "/"); }
  if (P.mode === "年") { yms = Object.keys(d.exp).filter((k) => k.startsWith(P.year)).sort(); label = `${P.year} 年`; }
  if (P.mode === "日") { const ym = P.day.slice(0, 7); yms = [ym];
    div = ym === today.slice(0, 7) ? +today.slice(8) : new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate();
    label = `${ym.replace("-", "/")} 日平均，÷${div} 天`; }
  const acc = {};
  yms.forEach((ym) => Object.entries(d.exp[ym] || {}).forEach(([c, x]) => {
    const a = acc[c] || (acc[c] = { t: 0, s: {}, q: {}, m: {} }); a.t += x.t;
    Object.entries(x.s).forEach(([k, n]) => (a.s[k] = (a.s[k] || 0) + n));
    Object.entries(x.q || {}).forEach(([k, n]) => (a.q[k] = (a.q[k] || 0) + n));
    Object.entries(x.m || {}).forEach(([k, n]) => (a.m[k] = (a.m[k] || 0) + n));
  }));
  // 囤貨：款號後面加件數與平均單價（件數沒填齊就標示；日平均不顯示件數）
  const stockLabel = (x, k) => { if (P.mode === "日") return k; const q = x.q[k] || 0, miss = x.m[k] || 0;
    return miss ? `${k}（${q ? fmt(q) + " 件＋" : ""}${miss} 筆沒填件數）` : q ? `${k}（${fmt(q)} 件，均價 ${fmt(x.s[k] / q)}）` : k; };
  const cats = Object.entries(acc).map(([name, x]) => {
    const subs = Object.entries(x.s).filter(([, n]) => Math.round(n / div)).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).map(([k, n]) => [name === "囤貨" ? stockLabel(x, k) : subName(name, k), n]);
    const other = x.t - subs.reduce((s, [, n]) => s + n, 0);
    if (Math.round(other / div)) subs.push(["其他（新科目或未列出）", other]);
    return { name, t: x.t / div, subs: subs.map(([k, n]) => [k, n / div]) };
  }).filter((c) => Math.round(c.t)).sort((a, b) => b.t - a.t);
  const bi = cats.findIndex((c) => c.name === "獎金"); // 獎金固定排在人事下面
  if (bi >= 0 && cats.some((c) => c.name === "人事")) { const [b] = cats.splice(bi, 1); cats.splice(cats.findIndex((c) => c.name === "人事") + 1, 0, b); }
  const tot = cats.reduce((s, c) => s + c.t, 0), pc = (n) => (tot ? (n / tot * 100).toFixed(1) + "%" : "");
  const basis = `<p class="muted">商品成本＝1688 出貨訂單實際付款；囤貨＝付款當月就算支出；退款單獨一行（退回的錢，減少支出）。</p>`;
  const note = P.mode === "日" ? `<p class="muted">日模式看的是這個月平均每天的支出結構（月支出 ÷ 天數），不是當天實際付款。${div < 28 ? "本月還沒結束，薪水等月底／下月才記帳的費用還沒進來，平均會偏低。" : ""}</p>` : "";
  $("#expStruct").innerHTML = `<h2>③ 支出結構（${esc(label)}）</h2>${cats.length ? `<div class="struct">${pie(cats.filter((c) => c.t > 0).map((c) => ({ name: c.name, v: c.t })), tot)}
    <table><tbody>${cats.map((c, i) => `<tr><td><span class="dot" style="${c.t > 0 ? "background:" + COLORS[i % COLORS.length] : "border:2px solid var(--pos)"}"></span>${esc(c.name)}</td><td class="${cls(-c.t)}">${fmt(-c.t)}</td><td>${pc(c.t)}</td></tr>`).join("")}
    <tr class="sum"><td>合計</td><td class="neg">${fmt(-tot)}</td><td>${tot ? "100.0%" : ""}</td></tr></tbody></table></div>` : `<p class="muted">這段期間沒有支出資料。</p>`}${note}${basis}`;
  $("#expDetail").innerHTML = `<h2>④ 支出明細（${esc(label)}，點大類展開）</h2>${cats.map((c) => `<details><summary><span class="l">${esc(c.name)}</span><span class="${cls(-c.t)}">${fmt(-c.t)}</span><span class="p">${pc(c.t)}</span></summary><table>${c.subs.map(([k, n]) => `<tr><td>${esc(k)}</td><td class="${cls(-n)}">${fmt(-n)}</td><td>${pc(n)}</td></tr>`).join("")}</table></details>`).join("")}
    <table><tr class="sum"><td>支出合計</td><td class="neg">${fmt(-tot)}</td><td>${tot ? "100.0%" : ""}</td></tr></table>`;
}
$("#go").onclick = () => enter($("#pw").value, $("#remember").checked);
$("#pw").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
$("#logout").onclick = () => { set(KEY, null); set(DKEY, null); location.reload(); };
// 記住的裝置：不顯示密碼框，先秀上次資料，背景更新
const saved = get(KEY);
if (saved) {
  let last = null; try { last = JSON.parse(get(DKEY) || "null"); } catch {}
  $("#gate").hidden = true; $("#main").hidden = false; $("#logout").hidden = false;
  let shown = false;
  if (valid(last)) { try { render(last); shown = true; } catch (e) { set(DKEY, null); } } else set(DKEY, null);
  if (!shown) $("#main").innerHTML = `<div class="box"><p class="muted" style="text-align:center">讀取中…</p></div>`;
  enter(saved, true);
}
</script>
