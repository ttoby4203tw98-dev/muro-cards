<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>財務總覽｜暮若</title>
<meta name="theme-color" content="#4a2c3a">
<meta name="robots" content="noindex">
<style>
  :root{--plum:#4a2c3a;--plum2:#6b3f52;--rose:#9c5c6e;--gold:#d6a680;--cream:#faf6f2;--card:#fff;--ink:#372a30;--ink2:#8a7580;--line:#eee2da;--neg:#b3261e;--pos:#1e7a46}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  header{background:linear-gradient(160deg,var(--plum),var(--plum2) 55%,var(--rose));color:#f6eee8;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 26px;border-radius:0 0 24px 24px}
  header a{color:#f6eee8;text-decoration:none;font-size:14px;opacity:.8}
  header h1{font-size:24px;letter-spacing:1px;margin-top:8px}
  header p{font-size:12px;opacity:.75;margin-top:4px}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px;box-shadow:0 6px 18px rgba(74,44,58,.06)}
  .box h2{font-size:16px;color:var(--plum);margin-bottom:10px;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th{background:var(--plum);color:#fff;font-weight:600;padding:8px 6px;font-size:13px}
  td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
  td:first-child,th:first-child{text-align:left}
  tr.sum td{font-weight:700;background:#f6eef0}
  .neg{color:var(--neg)} .pos{color:var(--pos)}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{background:#f8f2ef;border-radius:14px;padding:12px}
  .tile small{display:block;font-size:12px;color:var(--ink2)}
  .tile b{display:block;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
  .tile.all{grid-column:1/-1;background:#efe6ea}
  .struct{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .struct svg{flex:0 0 190px;max-width:190px}
  .struct table{flex:1 1 260px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  details{border-bottom:1px solid var(--line)}
  details summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 4px;cursor:pointer;font-weight:600;font-size:14px}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"›";display:inline-block;margin-right:8px;color:var(--ink2);transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  details summary .l{flex:1}
  details summary .p{color:var(--ink2);font-weight:400;font-size:12px;margin-left:8px;min-width:46px;text-align:right}
  details table{margin:0 0 10px}
  details td{font-size:13px;color:#4c3d44}
  .muted{color:var(--ink2);font-size:12px;margin-top:8px;line-height:1.6}
  #gate{max-width:360px;margin:60px auto;padding:0 16px}
  #gate input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:12px}
  #gate button{width:100%;margin-top:12px;font-size:16px;padding:12px;border:0;border-radius:12px;background:var(--plum);color:#fff;font-weight:600}
  #gate label{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink2)}
  #gate label input{width:auto;margin:0}
  #err{color:var(--neg);font-size:13px;margin-top:10px;min-height:18px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;font-size:14px;color:var(--ink)}
  .seg button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
  .seg input,.seg select{margin-left:auto;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kpi div{background:#f8f2ef;border-radius:14px;padding:12px 8px;text-align:center}
  .kpi small{display:block;font-size:12px;color:var(--ink2)}
  .kpi b{display:block;font-size:clamp(14px,4.4vw,19px);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .kpi .pl{background:#efe6ea}
  .kpi div small:last-child:not(:first-child){display:block;margin-top:2px}
  .bbar{height:8px;border-radius:99px;background:#eee2da;margin:10px 0 0;overflow:hidden}.bbar i{display:block;height:100%;background:var(--pos)}.bbar i.over{background:var(--neg)}
  #budget th.r,#budget td{text-align:right}#budget td:first-child{text-align:left}
  .bscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.btab{font-size:13px}.btab th,.btab td{padding:7px 5px;white-space:nowrap}.btab td small{display:block;font-size:11px;color:var(--ink2)}
  .top button{background:none;border:1px solid rgba(255,255,255,.4);color:#f6eee8;border-radius:99px;padding:4px 12px;font-size:12px}
  /* 分頁 */
  .tabs{display:flex;gap:6px;margin-top:16px;position:sticky;top:0;z-index:5;background:var(--cream);padding:8px 0}
  .tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
  .tabs button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
  .tabs button:focus-visible,.drv input:focus-visible,.bn-btn:focus-visible,.crow input:focus-visible{outline:2px solid var(--rose);outline-offset:1px}
  /* 預算分佈 */
  .drivers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .drv{background:#f8f2ef;border-radius:14px;padding:10px 12px;display:grid;gap:4px;min-width:0}
  .drv label,.drv .k{font-size:13px;font-weight:700;color:var(--plum)}
  .drv small{font-size:11px;color:var(--ink2)}
  .drv .in{display:flex;align-items:center;gap:4px}
  .drv input[type=number]{width:100%;min-width:0;font:inherit;font-size:18px;font-variant-numeric:tabular-nums;color:var(--plum);background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
  .drv input[type=range]{width:100%;accent-color:var(--plum)}
  .drv .v{font-size:18px;font-weight:700;color:var(--plum);font-variant-numeric:tabular-nums}
  .bud-derived{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink2);margin-top:10px}
  .bud-derived b{color:var(--ink);font-variant-numeric:tabular-nums}
  .bud-derived button{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:12px;color:var(--ink2);cursor:pointer}
  .be{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .be div{background:#f8f2ef;border-radius:14px;padding:12px}
  .be div.main{grid-column:1/-1;background:#efe6ea}
  .be small{display:block;font-size:12px;color:var(--ink2)}
  .be b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
  .be div.main b{font-size:24px;color:var(--plum)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-bottom:10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .brow{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;margin-bottom:12px}
  .brow b{font-size:13px}
  .bline{display:grid;grid-template-columns:1fr 76px;gap:6px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
  .bline i{display:block;height:11px;border-radius:2px;transition:width .25s}
  .bline i.o{background:#d9c9cf}.bline i.n{background:var(--plum)}
  .btbl td,.btbl th{white-space:nowrap}.btbl th{text-align:right}.btbl th:first-child{text-align:left}
  .btbl tr.cat td{font-weight:700;background:#f6eef0}.btbl tr.sub td:first-child{padding-left:16px}
  .btbl td.t,.btbl th.t{background:#fdf6e3}.btbl tr.cat td.t{background:#f3ead9}
  .btbl .var{font-size:10px;color:var(--rose);margin-left:4px}
  /* 獎金表 */
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
  .rule{background:#f8f2ef;border-left:4px solid var(--plum);border-radius:10px;padding:10px 12px}
  .rule small{display:block;font-size:12px;color:var(--ink2)}
  .rule b{display:block;font-size:15px;margin-top:2px}
  .tier td:first-child{font-weight:600;white-space:nowrap}.tier td:first-child em{font-style:normal;font-weight:400;color:var(--ink2);font-size:11px;margin-left:5px}
  .tier tr.zero td{color:var(--ink2)}.tier tr.open td{background:#fbf1dd;color:#9a6416;font-weight:700}
  .notes{margin:10px 0 0 18px;color:var(--ink2);font-size:13px;line-height:1.6}
  .example{margin-top:10px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7}
  .example span{color:var(--ink2);font-variant-numeric:tabular-nums}
  .calcbox{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .calcbox h3{font-size:15px;color:var(--plum)}
  .crow{display:grid;grid-template-columns:1fr 1fr minmax(120px,1.1fr) 30px;gap:8px;align-items:end;margin-top:8px}
  .crow.tom{grid-template-columns:1fr 1fr 30px}
  .crow label{font-size:12px;color:var(--ink2)}
  .crow input{display:block;width:100%;margin-top:3px;font:inherit;font-size:16px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
  .crow input.bad{border-color:var(--neg)}
  .crow .out{font-size:13px;font-variant-numeric:tabular-nums;padding-bottom:6px}
  .crow .out .dim{color:var(--ink2)}
  .crow .x{width:30px;height:34px;border:0;background:none;color:var(--ink2);font-size:20px;cursor:pointer}
  @media (max-width:560px){.crow{grid-template-columns:1fr 1fr 30px}.crow .out{grid-column:1/3;padding-bottom:0}}
  .bn-act{display:flex;gap:8px;margin-top:10px}
  .bn-btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;color:var(--ink);cursor:pointer}
  .result{margin-top:12px;background:#fbf1dd;border-radius:12px;padding:10px 12px;font-size:14px;font-variant-numeric:tabular-nums}
  .result .line{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
  .result .line span:first-child{color:var(--ink2)}
  .result .big{font-size:17px;font-weight:700;color:#9a6416}
  .result .warn{color:var(--neg);font-size:13px}
  @media (prefers-reduced-motion:reduce){.bline i{transition:none}}
</style>
</head>
<body>
<header><div class="wrap" style="padding-bottom:0">
  <div class="top"><a href="team.html">‹ 團隊首頁</a><button id="logout" hidden>登出</button></div>
  <h1>財務總覽</h1><p id="sub">2026/1 ~ 2026/9・資料即時讀自財會表</p>
</div></header>

<div id="gate">
  <div class="box"><h2>🔒 請輸入財務密碼</h2>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="密碼">
    <label><input id="remember" type="checkbox" checked> 記住這台裝置</label>
    <button id="go">進入</button><div id="err"></div>
  </div>
</div>
<div class="wrap" id="main" hidden></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzLo_qUekF345A28WAiQbC1BhxiBA7ufsbw63XczTjXlZv2972bQ4NGmtYPOfnPHZE/exec"; // 財會表 Apps Script 網頁應用程式網址（部署後填入）
const KEY = "muro_fin_pw", DKEY = "muro_fin_data"; // 記住裝置時，也存上次的資料讓頁面秒開
const $ = (s) => document.querySelector(s);
const fmt = (n) => (typeof n === "number" ? Math.round(n).toLocaleString("zh-TW") : n === "" || n == null ? "" : String(n));
const cls = (n) => (typeof n === "number" && n < 0 ? "neg" : typeof n === "number" && n > 0 ? "pos" : "");
const pct = (n) => (typeof n === "number" ? (n * 100).toFixed(1) + "%" : "");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COLORS = ["#4a2c3a", "#9c5c6e", "#d6a680", "#6b8fa3", "#7a9e7e", "#c98b6b", "#8e7cc3", "#b8a99a", "#5f8a8b", "#d4b35f"];
const get = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const set = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

async function call(body) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  return r.json();
}
let busy = false, lastAt = 0; // 背景更新中不重複送；lastAt＝上次成功抓到的時間
async function enter(pw, remember, fresh = true) { // 一律跳過伺服器 5 分鐘暫存，讀財會表最新
  if (busy) return; busy = true;
  $("#err").textContent = "讀取中…"; setSync("更新中…");
  try {
    let d = await call({ action: "overview", pw, fresh: !!fresh });
    if (d.ok && !valid(d)) d = await call({ action: "overview", pw, fresh: true }); // 偶爾回到非財務資料 → 重抓一次
    if (d.ok && !valid(d)) throw new Error("財會表回應格式不對，請按重新整理");
    if (!d.ok) { if (/密碼|設定/.test(d.err || "")) { set(KEY, null); set(DKEY, null); showGate(); } $("#err").textContent = d.err || "讀取失敗"; setSync(""); return; }
    if (remember) { set(KEY, pw); set(DKEY, JSON.stringify(d)); }
    render(d); setSync(""); lastAt = Date.now();
  } catch (e) { $("#err").textContent = "連不到財會表：" + e.message;
    if ($("#sync")) setSync("連不到財會表，顯示的是上次的資料"); else if (!$("#main").hidden) { shell(); $("#finPane").innerHTML = `<div class="box"><p class="muted" style="text-align:center">連不到財會表，請稍後重新整理。</p></div>`; } }
  finally { busy = false; }
}
const valid = (d) => !!(d && d.ok && d.wallet && Array.isArray(d.struct) && Array.isArray(d.detail) && Array.isArray(d.offbook));
function showGate() { $("#gate").hidden = false; $("#main").hidden = true; $("#logout").hidden = true; }
function setSync(t) { const el = $("#sync"); if (el) el.textContent = t; }
function pie(items, center) { // items: [{name, v}] 正數；center = 中間顯示的數字（預設加總）
  const tot = items.reduce((s, x) => s + x.v, 0) || 1; let a = -Math.PI / 2, out = "";
  items.forEach((x, i) => {
    if (x.v / tot > 0.9999) { // 只有一類：SVG 弧線起點＝終點畫不出來，改畫整圈
      out += `<circle cx="100" cy="100" r="71" fill="none" stroke="${COLORS[i % COLORS.length]}" stroke-width="38"><title>${esc(x.name)} 100%</title></circle>`; return; }
    const f = x.v / tot, a2 = a + f * Math.PI * 2, large = f > 0.5 ? 1 : 0, R = 90, r = 52;
    const p = (ang, rad) => [100 + rad * Math.cos(ang), 100 + rad * Math.sin(ang)].map((n) => n.toFixed(2)).join(" ");
    out += `<path d="M ${p(a, R)} A ${R} ${R} 0 ${large} 1 ${p(a2, R)} L ${p(a2, r)} A ${r} ${r} 0 ${large} 0 ${p(a, r)} Z" fill="${COLORS[i % COLORS.length]}"><title>${esc(x.name)} ${(f * 100).toFixed(1)}%</title></path>`;
    a = a2;
  });
  return `<svg viewBox="0 0 200 200" role="img" aria-label="支出結構圓餅圖">${out}<text x="100" y="96" text-anchor="middle" font-size="12" fill="#8a7580">總支出</text><text x="100" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#372a30">${fmt(center ?? tot)}</text></svg>`;
}
function render(d) {
  $("#gate").hidden = true; $("#main").hidden = false; $("#logout").hidden = false;
  if (d.title) $("#sub").textContent = String(d.title).replace(/^財務總覽2｜/, "") + "・資料即時讀自財會表";
  const w = d.wallet.val, fx = (x, cur) => (typeof x === "number" ? (x < 0 ? "-" : "") + cur + Math.abs(Math.round(x)).toLocaleString("zh-TW") : x);
  const st = d.struct.filter((r) => r[0] && r[0] !== "合計"), stSum = d.struct.find((r) => r[0] === "合計") || [];
  // 支出明細：依大類分組（大類列 A 有字、科目列 A 空白 B 有字）
  const groups = []; d.detail.forEach((r) => { if (!r[0] && !r[1]) return; if (r[0] && r[0] !== "支出合計") groups.push({ r, subs: [] }); else if (!r[0] && groups.length) groups[groups.length - 1].subs.push(r); });
  const detTotal = d.detail.find((r) => r[0] === "支出合計");
  const grpHtml = (g, withPct) => `<details><summary><span class="l">${esc(g.r[0])}</span><span class="${cls(g.r[2])}">${fmt(g.r[2])}</span>${withPct ? `<span class="p">${pct(g.r[3])}</span>` : ""}</summary><table>${g.subs.filter((s) => !(String(s[1]).startsWith("其他") && Math.round(s[2]) === 0)).map((s) => `<tr><td>${esc(s[1])}</td><td class="${cls(s[2])}">${fmt(s[2])}</td>${withPct ? `<td>${pct(s[3])}</td>` : ""}</tr>`).join("")}</table></details>`;
  // ⑤ 只顯示蝦幣充值、廣告充值（其餘內部轉帳、蝦皮客人退款留在財會表）
  const OFF_SHOW = ["蝦幣充值", "廣告充值"], offShow = d.offbook.filter((r) => !r[0] && OFF_SHOW.includes(r[1])), offSum = offShow.reduce((s, r) => s + (Number(r[2]) || 0), 0);
  shell(); renderPlan(d);
  $("#finPane").innerHTML = `
  <div class="box"><h2>① 收支總覽</h2><div id="period"></div></div>
  <div class="box"><h2>② 錢包餘額（最新）</h2><div class="tiles">
    <div class="tile"><small>人民幣錢包</small><b class="${cls(w[0])}">${fx(w[0], "¥")}</b></div>
    <div class="tile"><small>台幣錢包</small><b class="${cls(w[1])}">${fx(w[1], "NT$")}</b></div>
    <div class="tile"><small>公司錢包</small><b class="${cls(w[2])}">${fx(w[2], "NT$")}</b></div>
    <div class="tile all"><small>合計（台幣，人民幣×匯率）</small><b class="${cls(w[3])}">${fx(w[3], "NT$")}</b></div></div></div>
  <div class="box" id="budget" hidden></div>
  <div class="box" id="expStruct"><h2>③ 支出結構（累計）</h2><div class="struct">${pie(st.map((r) => ({ name: r[0], v: Math.abs(r[1]) })))}
    <table><tbody>${st.map((r, i) => `<tr><td><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>${esc(r[0])}</td><td class="neg">${fmt(r[1])}</td><td>${pct(r[2])}</td></tr>`).join("")}
    <tr class="sum"><td>合計</td><td class="neg">${fmt(stSum[1])}</td><td>${pct(stSum[2])}</td></tr></tbody></table></div></div>
  <div class="box" id="expDetail"><h2>④ 支出明細（點大類展開）</h2>${groups.map((g) => grpHtml(g, true)).join("")}
    <table><tr class="sum"><td>支出合計</td><td class="neg">${detTotal ? fmt(detTotal[2]) : ""}</td><td>${detTotal ? pct(detTotal[3]) : ""}</td></tr></table></div>
  <div class="box"><h2>⑤ 有記帳但不算進損益</h2><table>${offShow.map((s) => `<tr><td>${esc(s[1])}</td><td class="${cls(s[2])}">${fmt(s[2])}</td></tr>`).join("")}
    <tr class="sum"><td>合計</td><td class="${cls(offSum)}">${fmt(offSum)}</td></tr></table>
    <p class="muted">充值是先把錢放進蝦皮，實際花掉時才以「廣告蝦幣」算進上面的支出，所以這裡不重複計算。</p></div>
  <p class="muted" style="text-align:center">更新時間 ${new Date(d.at).toLocaleString("zh-TW")}　<span id="sync"></span>　<a href="#" id="refresh" style="color:var(--rose)">重新整理</a></p>`;

    `<div class="brow" style="border-top:2px solid var(--ink);padding-top:10px"><b>合計</b><div class="bline" style="grid-template-columns:1fr auto"><span style="text-align:left">${n0(to)} → <b style="color:var(--plum)">${n0(tt)}</b></span><span>${dd(tt - to)}</span></div></div>`;
  $("#pv-tbl").innerHTML = cats.map(([c, o, p, t, rs]) => `<tr class="cat"><td>${esc(c)}</td><td>${n0(o)}</td><td>${n0(p)}</td><td class="t">${n0(t)}</td><td>${dd(t - o)}</td></tr>` +
    rs.map(([k, a, b, x, v]) => `<tr class="sub"><td>${esc(k)}${v ? '<span class="var">隨上方</span>' : ""}</td><td>${n0(a)}</td><td>${n0(b)}</td><td class="t">${n0(x)}</td><td>${dd(x - a)}</td></tr>`).join("")).join("") +
    `<tr class="sum"><td>合計</td><td>${n0(to)}</td><td>${n0(tp)}</td><td class="t">${n0(tt)}</td><td>${dd(tt - to)}</td></tr>`;
  const fixed = tt - Object.values(VAR).reduce((a, f) => a + f(PV), 0);
  const prof = (g) => { const v = { ...PV, gross: g }; return net(v) * (1 - v.fee / 100) - fixed - Object.values(VAR).reduce((a, f) => a + f(v), 0); };
  const inc = net(PV) * (1 - PV.fee / 100), pl = inc - tt;
  $("#pv-net").textContent = n0(net(PV)); $("#pv-inc").textContent = n0(inc); $("#pv-ord").textContent = n0(net(PV) / PV.aov);
  let be = null; if (prof(2e7) > 0) { let lo = 0, hi = 2e7; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (prof(m) >= 0) hi = m; else lo = m; } be = hi; }
  if (be === null) { ["#be-inc", "#be-gross", "#be-net"].forEach((k) => ($(k).textContent = "—")); $("#be-gap").textContent = "每賣一筆都虧，無法打平"; }
  else { const bn = be * (1 - PV.fail / 100), bi = bn * (1 - PV.fee / 100);
    $("#be-inc").textContent = n0(bi); $("#be-gross").textContent = n0(be); $("#be-net").textContent = n0(bn);
    $("#be-gap").textContent = bi > inc ? `比試算實收多 ${n0(bi - inc)}` : `已超過 ${n0(inc - bi)}`; }
  $("#be-pl").textContent = (pl < 0 ? "−" : "+") + n0(Math.abs(pl)); $("#be-pl").className = pl < 0 ? "neg" : "pos";
}

// ---- 獎金表（2026-10 新制）：級距＋試算
const NABY_T = [[10000, 48, 12, "1萬"], [15000, 80, 20, "1萬5"], [20000, 180, 45, "2萬"], [25000, 220, 55, "2萬5"], [30000, 400, 100, "3萬"], [35000, 460, 115, "3萬5"], [40000, 520, 130, "4萬"], [45000, 600, 150, "4萬5"], [50000, 880, 220, "5萬"], [55000, 960, 240, "5萬5"],
  [60000, 1080, 270, "6萬"], [65000, 1150, 290, "6萬5"], [70000, 1550, 360, "7萬"], [75000, 1650, 420, "7萬5"], [80000, 1750, 440, "8萬"], [85000, 1850, 470, "8萬5"], [90000, 1960, 490, "9萬"], [95000, 2070, 520, "9萬5"], [100000, 2650, 660, "10萬"]];
const TOM_T = [["未達 8千", "0%"], ["8千至1萬", "1%"], ["1萬至3萬", "2%"], ["3萬至6萬", "3%"], ["6萬至10萬", "4%"], ["大於 10.01萬", "5%"], ["15萬以上", "8%"]];
function nabyBonus(sales, fail) {
  const base = Math.round((sales - fail) * 0.7);
  if (base >= 105000) return { base, host: Math.round(base * 0.12), ctrl: Math.round(base * 0.03), tier: "10萬5以上（抽成）" };
  let hit = null; NABY_T.forEach((t) => { if (base >= t[0]) hit = t; });
  return hit ? { base, host: hit[1], ctrl: hit[2], tier: hit[3] + "級" } : { base, host: 0, ctrl: 0, tier: "未達 1 萬" };
}
function tomBonus(sales, fail) {
  const base = Math.round((sales - fail) * 0.7 * 100) / 100;
  const [rate, tier] = base >= 150000 ? [0.08, "15萬以上"] : base > 100000 ? [0.05, "大於 10.01萬"] : base >= 60000 ? [0.04, "6萬至10萬"] : base >= 30000 ? [0.03, "3萬至6萬"] : base >= 10000 ? [0.02, "1萬至3萬"] : base >= 8000 ? [0.01, "8千至1萬"] : [0, "未達 8千"];
  const host = Math.round(base * rate); return { base, rate, tier, host, ctrl: Math.round(host * 0.25) };
}
function renderBonus() {
  $("#bonPane").innerHTML = `<div class="box"><h2>直播獎金表（2026/10 起）</h2><div class="rules">
      <div class="rule"><small>兩組共用的核算基準</small><b>（銷售額 − 不成立金額）× 0.7</b><small>算出來的就是對照級距用的「實際銷售額」。</small></div>
      <div class="rule"><small>Naby ＆ 諾諾</small><b>逐場計算</b><small>每一場各自對照級距，領固定獎金。</small></div>
      <div class="rule"><small>番茄 ＆ 小安</small><b>同一天合併計算</b><small>同一天、同一位主播的場次加總後，乘上提成%。</small></div></div>
      <p class="muted">發放月份：N 月份獎金，用 N−1 月 1 日至月底的直播數據計算。</p></div>
    <div class="box"><h2>Naby ＆ 諾諾　單場直播獎金</h2><p class="muted" style="margin:0 0 8px">以該場實際銷售額取不超過它的最高級距；未達 1 萬不發。</p>
      <div class="bscroll"><table class="tier"><thead><tr><th>實際銷售額</th><th style="text-align:right">主播</th><th style="text-align:right">中控</th></tr></thead><tbody>
      <tr class="zero"><td>未達 1 萬</td><td>0</td><td>0</td></tr>${NABY_T.map((t) => `<tr><td>${t[3]}<em>${fmt(t[0])}</em></td><td>${fmt(t[1])}</td><td>${fmt(t[2])}</td></tr>`).join("")}
      <tr class="open"><td>10萬5以上<em>105,000+</em></td><td>12%</td><td>3%</td></tr></tbody></table></div>
      <ul class="notes"><li>10 萬 5 以上改為抽成：主播拿實際銷售額的 12%，中控 3%。</li><li>落在兩個級距之間以較低一級為準（例如 36,400 算 3 萬 5 級）。</li></ul>
      <div class="example"><b>範例</b>　某場銷售額 60,000，不成立 8,000<br><span>(60,000 − 8,000) × 0.7 = 36,400 → 3萬5 級 → 主播 460、中控 115</span></div>
      <div class="calcbox"><h3>獎金試算</h3><p class="muted" style="margin:2px 0 0">一列填一場的銷售額與不成立金額。</p><div id="naby-rows"></div>
        <div class="bn-act"><button type="button" class="bn-btn" id="naby-add">新增一場</button><button type="button" class="bn-btn" id="naby-clear">清除全部</button></div><div class="result" id="naby-result" aria-live="polite"></div></div></div>
    <div class="box"><h2>番茄 ＆ 小安　單日提成</h2><p class="muted" style="margin:0 0 8px">同一天、同一位主播的所有場次加總，算出當日實際銷售額，整包乘上提成%（非累進）。</p>
      <table class="tier"><thead><tr><th>當日實際銷售額</th><th style="text-align:right">提成%</th></tr></thead><tbody>${TOM_T.map((t, i) => `<tr class="${i === 0 ? "zero" : i === TOM_T.length - 1 ? "open" : ""}"><td>${t[0]}</td><td>${t[1]}</td></tr>`).join("")}</tbody></table>
      <div class="rules" style="margin-top:10px"><div class="rule"><small>主播獎金</small><b>當日實際銷售額 × 提成%</b></div><div class="rule"><small>中控獎金</small><b>當日主播獎金 × 25%</b><small>發給當天搭配的中控。</small></div></div>
      <ul class="notes"><li>各級距含下限，例如剛好 8,000 算 1%。</li><li>同一天兩位主播各自計算，不互相加總。</li><li>當日合計獎金記在該主播當天最後一場，同日其他場次填 0。</li></ul>
      <div class="example"><b>範例</b>　安琪當天兩場合計 20,000，不成立合計 2,000<br><span>(20,000 − 2,000) × 0.7 = 12,600 → 1萬至3萬 2% → 主播 252；當天中控番茄 252 × 25% = 63</span></div>
      <div class="calcbox"><h3>獎金試算</h3><p class="muted" style="margin:2px 0 0">把同一位主播「同一天」的每一場都填進來，會自動加總後套用提成%。</p><div id="tom-rows"></div>
        <div class="bn-act"><button type="button" class="bn-btn" id="tom-add">新增一場</button><button type="button" class="bn-btn" id="tom-clear">清除全部</button></div><div class="result" id="tom-result" aria-live="polite"></div></div></div>`;
  const num = (v) => { const n = parseFloat(String(v).replace(/,/g, "")); return isNaN(n) ? 0 : n; };
  const makeRow = (box, tom, onChange) => { const row = document.createElement("div"); row.className = "crow" + (tom ? " tom" : "");
    row.innerHTML = `<label>銷售額<input type="text" inputmode="numeric" autocomplete="off" placeholder="例如 60000"></label><label>不成立金額<input type="text" inputmode="numeric" autocomplete="off" placeholder="沒有就留空"></label>${tom ? "" : '<div class="out"><span class="dim">—</span></div>'}<button type="button" class="x" aria-label="刪除這一場">×</button>`;
    row.addEventListener("input", onChange);
    row.querySelector(".x").onclick = () => { box.removeChild(row); if (!box.children.length) makeRow(box, tom, onChange); onChange(); };
    box.appendChild(row); return row; };
  const readRow = (row) => { const [a, b] = row.querySelectorAll("input"); a.classList.remove("bad"); b.classList.remove("bad");
    return { f: b, empty: !a.value.trim() && !b.value.trim(), sv: num(a.value), fv: num(b.value) }; };
  const nR = $("#naby-rows"), nOut = $("#naby-result"), tR = $("#tom-rows"), tOut = $("#tom-result");
  const upN = () => { let th = 0, tc = 0, cnt = 0, warn = false;
    [...nR.children].forEach((row) => { const r = readRow(row), out = row.querySelector(".out");
      if (r.empty) { out.innerHTML = '<span class="dim">—</span>'; return; }
      if (r.fv > r.sv) { r.f.classList.add("bad"); warn = true; out.innerHTML = '<span class="dim">不成立大於銷售額</span>'; return; }
      const c = nabyBonus(r.sv, r.fv); th += c.host; tc += c.ctrl; cnt++;
      out.innerHTML = `<span class="dim">${fmt(c.base)}・${c.tier}</span><br>主播 <b>${fmt(c.host)}</b>　中控 <b>${fmt(c.ctrl)}</b>`; });
    nOut.innerHTML = !cnt ? (warn ? '<p class="warn">不成立金額不能大於銷售額。</p>' : '<span style="color:var(--ink2)">填入銷售額後，合計會顯示在這裡。</span>')
      : `<div class="line"><span>計算場數</span><span>${cnt} 場</span></div><div class="line"><span>主播獎金合計</span><span class="big">${fmt(th)}</span></div><div class="line"><span>中控獎金合計</span><span class="big">${fmt(tc)}</span></div>${warn ? '<p class="warn">有一列的不成立金額大於銷售額，沒有計入。</p>' : ""}`; };
  const upT = () => { let S = 0, F = 0, cnt = 0, warn = false;
    [...tR.children].forEach((row) => { const r = readRow(row); if (r.empty) return; if (r.fv > r.sv) { r.f.classList.add("bad"); warn = true; return; } S += r.sv; F += r.fv; cnt++; });
    if (!cnt) { tOut.innerHTML = warn ? '<p class="warn">不成立金額不能大於銷售額。</p>' : '<span style="color:var(--ink2)">填入銷售額後，當日獎金會顯示在這裡。</span>'; return; }
    const c = tomBonus(S, F);
    tOut.innerHTML = `<div class="line"><span>當日 ${cnt} 場　銷售額合計</span><span>${fmt(S)}</span></div><div class="line"><span>不成立合計</span><span>${fmt(F)}</span></div><div class="line"><span>當日實際銷售額（×0.7）</span><span>${fmt(c.base)}</span></div>
      <div class="line"><span>適用級距</span><span>${c.tier}　${Math.round(c.rate * 100)}%</span></div><div class="line"><span>主播獎金</span><span class="big">${fmt(c.host)}</span></div><div class="line"><span>當天中控（主播 × 25%）</span><span class="big">${fmt(c.ctrl)}</span></div>${warn ? '<p class="warn">有一列的不成立金額大於銷售額，沒有計入。</p>' : ""}`; };
  const resetN = () => { nR.innerHTML = ""; makeRow(nR, false, upN); upN(); }, resetT = () => { tR.innerHTML = ""; makeRow(tR, true, upT); makeRow(tR, true, upT); upT(); };
  $("#naby-add").onclick = () => makeRow(nR, false, upN).querySelector("input").focus(); $("#naby-clear").onclick = resetN;
  $("#tom-add").onclick = () => makeRow(tR, true, upT).querySelector("input").focus(); $("#tom-clear").onclick = resetT;
  resetN(); resetT();
}
$("#go").onclick = () => enter($("#pw").value, $("#remember").checked);
$("#pw").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
$("#logout").onclick = () => { set(KEY, null); set(DKEY, null); location.reload(); };
// 記住的裝置：不顯示密碼框，先秀上次資料，背景更新
const saved = get(KEY);
if (saved) {
  let last = null; try { last = JSON.parse(get(DKEY) || "null"); } catch {}
  $("#gate").hidden = true; $("#main").hidden = false; $("#logout").hidden = false;
  let shown = false;
  if (valid(last)) { try { render(last); shown = true; } catch (e) { set(DKEY, null); } } else set(DKEY, null);
  if (!shown) { shell(); $("#finPane").innerHTML = `<div class="box"><p class="muted" style="text-align:center">讀取中…</p></div>`; }
  enter(saved, true);
}
// 手機切回來（App 沒被關掉、只是放背景）也重抓：超過 30 秒沒更新就讀最新
const again = () => { const pw = get(KEY); if (pw && !document.hidden && Date.now() - lastAt > 30000) enter(pw, true); };
document.addEventListener("visibilitychange", again);
window.addEventListener("pageshow", (e) => { if (e.persisted) again(); });
</script>
